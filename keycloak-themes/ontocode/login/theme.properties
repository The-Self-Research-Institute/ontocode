parent=keycloak
import=common/keycloak

# OntoCode Theme Configuration
# This theme provides custom branding for the OntoCode platform

# Internationalization
locales=en,es,fr,de,ja,zh-CN

# Styles
styles=css/login.css css/ontocode.css

# Features
features=account2,account-api,admin-fine-grained-authz,admin2,authorization,docker,impersonation,openshift-integration,scripts,token-exchange,web-authn

# Logo
logo=ontocode-logo.png
logoUrl=/
logoAlt=OntoCode

# Favicon
favicon=favicon.ico

# Social providers
socialProvidersVisible=true
