# Memory sizing override — t3.2xlarge (32 GB RAM)
# Total container limits ≈ 23 GB | leaves ~9 GB for OS + Docker overhead
#
# Usage:
#   docker compose -f docker-compose.production.yml -f docker-compose.t3-2xlarge.yml up -d

services:
  mongo:
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5", "--auth"]
    deploy:
      resources:
        limits:
          memory: 1g

  graphdb:
    environment:
      GDB_HEAP_SIZE: 8g
      GDB_JAVA_OPTS: "-XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled -XX:InitiatingHeapOccupancyPercent=45 -XX:G1HeapRegionSize=8m -DentityExpansionLimit=100000000 -Djdk.xml.entityExpansionLimit=100000000"
    deploy:
      resources:
        limits:
          memory: 10g

  auth:
    environment:
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx640m -XX:+UseG1GC
    deploy:
      resources:
        limits:
          memory: 768m

  gateway:
    environment:
      JAVA_OPTS: -Xms128m -Xmx1024m -XX:+UseG1GC
    deploy:
      resources:
        limits:
          memory: 2g

  owl-editor:
    environment:
      JAVA_OPTS: "-Xms2g -Xmx6g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/heap-dump.hprof -Xlog:gc*:file=/app/logs/gc.log:time,uptime,level,tags:filecount=3,filesize=20m -DentityExpansionLimit=100000000 -Djdk.xml.entityExpansionLimit=100000000"
      ONTOCODE_IMPORT_MAX_CONCURRENT: 2
    deploy:
      resources:
        limits:
          memory: 7g

  swrl-service:
    environment:
      JAVA_OPTS: "-Xms256m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/heap-dump.hprof -Xlog:gc*:file=/app/logs/gc.log:time,uptime,level,tags:filecount=2,filesize=10m"
    deploy:
      resources:
        limits:
          memory: 1536m

  plugin-service:
    environment:
      JAVA_OPTS: -Xms128m -Xmx384m -XX:+UseG1GC
    deploy:
      resources:
        limits:
          memory: 512m

  webapp:
    deploy:
      resources:
        limits:
          memory: 256m
