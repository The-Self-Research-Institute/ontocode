<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaboration Test</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .user-section { border: 1px solid #ccc; padding: 15px; margin: 10px 0; border-radius: 8px; }
        .user1 { background-color: #e3f2fd; }
        .user2 { background-color: #f3e5f5; }
        button { padding: 8px 16px; margin: 5px; cursor: pointer; }
        .connected { color: green; font-weight: bold; }
        .disconnected { color: red; font-weight: bold; }
        .log { background: #f5f5f5; padding: 10px; max-height: 300px; overflow-y: auto; font-size: 12px; }
        input { padding: 5px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Collaborative Editing Test</h1>
    <p>Open this page in two browser tabs or windows to simulate multiple users.</p>

    <div class="user-section user1">
        <h2>User 1</h2>
        <input type="text" id="username1" placeholder="Username" value="Alice">
        <input type="text" id="projectId1" placeholder="Project ID" value="test-project">
        <button onclick="connect(1)">Connect</button>
        <button onclick="disconnect(1)">Disconnect</button>
        <button onclick="sendEdit(1)">Send Edit</button>
        <button onclick="sendPresence(1)">Send Presence</button>
        <div>Status: <span id="status1" class="disconnected">Disconnected</span></div>
        <div>Active Users: <span id="users1">0</span></div>
        <h3>Log:</h3>
        <div id="log1" class="log"></div>
    </div>

    <div class="user-section user2">
        <h2>User 2</h2>
        <input type="text" id="username2" placeholder="Username" value="Bob">
        <input type="text" id="projectId2" placeholder="Project ID" value="test-project">
        <button onclick="connect(2)">Connect</button>
        <button onclick="disconnect(2)">Disconnect</button>
        <button onclick="sendEdit(2)">Send Edit</button>
        <button onclick="sendPresence(2)">Send Presence</button>
        <div>Status: <span id="status2" class="disconnected">Disconnected</span></div>
        <div>Active Users: <span id="users2">0</span></div>
        <h3>Log:</h3>
        <div id="log2" class="log"></div>
    </div>

    <script>
        const clients = {};
        const WS_URL = 'http://localhost:80/ws';
        // const WS_URL = 'http://localhost:8083/ws';

        function log(userId, message) {
            const logDiv = document.getElementById(`log${userId}`);
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML = `[${timestamp}] ${message}<br>` + logDiv.innerHTML;
        }

        function updateStatus(userId, connected) {
            const statusSpan = document.getElementById(`status${userId}`);
            statusSpan.textContent = connected ? 'Connected' : 'Disconnected';
            statusSpan.className = connected ? 'connected' : 'disconnected';
        }

        function connect(userId) {
            const username = document.getElementById(`username${userId}`).value;
            const projectId = document.getElementById(`projectId${userId}`).value;
            
            if (clients[userId]) {
                log(userId, 'Already connected');
                return;
            }

            log(userId, `Connecting as ${username} to project ${projectId}...`);

            const client = new StompJs.Client({
                brokerURL: WS_URL,
                webSocketFactory: () => new SockJS(WS_URL),
                reconnectDelay: 5000,
                heartbeatIncoming: 4000,
                heartbeatOutgoing: 4000,
                debug: (str) => log(userId, `DEBUG: ${str}`),
                
                onConnect: () => {
                    log(userId, '✓ Connected to WebSocket');
                    updateStatus(userId, true);
                    
                    // Subscribe to topics
                    client.subscribe(`/topic/ontology/${projectId}`, (message) => {
                        const edit = JSON.parse(message.body);
                        log(userId, `📝 Edit received: ${edit.type} by ${edit.username}`);
                    });
                    
                    client.subscribe(`/topic/presence/${projectId}`, (message) => {
                        const presence = JSON.parse(message.body);
                        log(userId, `👤 Presence: ${presence.type} - ${presence.username}`);
                        
                        // Update user count (simple simulation)
                        const usersSpan = document.getElementById(`users${userId}`);
                        if (presence.type === 'USER_JOINED') {
                            usersSpan.textContent = parseInt(usersSpan.textContent) + 1;
                        } else if (presence.type === 'USER_LEFT') {
                            usersSpan.textContent = Math.max(0, parseInt(usersSpan.textContent) - 1);
                        }
                    });
                    
                    client.subscribe(`/topic/locks/${projectId}`, (message) => {
                        const lock = JSON.parse(message.body);
                        log(userId, `🔒 Lock: ${lock.type} on ${lock.nodeId}`);
                    });
                    
                    // Send USER_JOINED presence
                    setTimeout(() => {
                        client.publish({
                            destination: `/app/collab/${projectId}/presence`,
                            body: JSON.stringify({
                                type: 'USER_JOINED',
                                projectId: projectId,
                                userId: `user-${userId}`,
                                username: username,
                                timestamp: Date.now()
                            })
                        });
                        log(userId, `Sent USER_JOINED presence`);
                    }, 100);
                },
                
                onStompError: (frame) => {
                    log(userId, `❌ STOMP error: ${frame.headers['message']}`);
                    updateStatus(userId, false);
                },
                
                onWebSocketError: (event) => {
                    log(userId, `❌ WebSocket error`);
                    updateStatus(userId, false);
                },
                
                onDisconnect: () => {
                    log(userId, 'Disconnected');
                    updateStatus(userId, false);
                }
            });

            client.activate();
            clients[userId] = { client, projectId, username };
        }

        function disconnect(userId) {
            const clientData = clients[userId];
            if (!clientData) {
                log(userId, 'Not connected');
                return;
            }

            const { client, projectId, username } = clientData;
            
            // Send USER_LEFT presence
            client.publish({
                destination: `/app/collab/${projectId}/presence`,
                body: JSON.stringify({
                    type: 'USER_LEFT',
                    projectId: projectId,
                    userId: `user-${userId}`,
                    username: username,
                    timestamp: Date.now()
                })
            });

            client.deactivate();
            delete clients[userId];
            log(userId, 'Disconnected');
            updateStatus(userId, false);
        }

        function sendEdit(userId) {
            const clientData = clients[userId];
            if (!clientData) {
                log(userId, 'Not connected');
                return;
            }

            const { client, projectId, username } = clientData;
            
            const edit = {
                type: 'CLASS_MODIFIED',
                projectId: projectId,
                userId: `user-${userId}`,
                username: username,
                classId: 'TestClass',
                newLabel: `Updated by ${username}`,
                timestamp: Date.now()
            };

            client.publish({
                destination: `/app/collab/${projectId}/edit`,
                body: JSON.stringify(edit)
            });

            log(userId, `Sent edit: ${edit.type}`);
        }

        function sendPresence(userId) {
            const clientData = clients[userId];
            if (!clientData) {
                log(userId, 'Not connected');
                return;
            }

            const { client, projectId, username } = clientData;
            
            const presence = {
                type: 'USER_ACTIVE',
                projectId: projectId,
                userId: `user-${userId}`,
                username: username,
                timestamp: Date.now()
            };

            client.publish({
                destination: `/app/collab/${projectId}/presence`,
                body: JSON.stringify(presence)
            });

            log(userId, `Sent presence: ${presence.type}`);
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            Object.keys(clients).forEach(userId => disconnect(userId));
        });
    </script>
</body>
</html>
