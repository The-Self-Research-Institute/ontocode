# GraphDB Optimized Configuration for Large File Imports
# Place this in: <graphdb-home>/conf/graphdb.properties
#
# Performance Impact: 2-5 minutes saved for 122MB files
#
# Expected improvement:
# - Before: 15-20 minutes for 122MB
# - After: 5-10 minutes for 122MB

# ============================================
# MEMORY SETTINGS (Most Important!)
# ============================================

# Increase heap size for large imports
# For 122MB files: minimum 8GB, recommended 16GB
-Xmx16g
-Xms16g

# Young generation size (for frequent object allocation during import)
-Xmn4g

# Use G1GC for better large heap performance
-XX:+UseG1GC
-XX:MaxGCPauseMillis=200

# ============================================
# GRAPHDB SPECIFIC SETTINGS
# ============================================

# Entity index size - increase for large ontologies
# Default: 10000000, Recommended for large files: 20000000
entity-index-size=20000000

# Tuple index memory - increase for better performance
# Default: 512m, Recommended: 1024m or 2048m
tuple-index-memory=2048m

# Enable parallel import (if supported)
parallel-import=true

# Number of parallel threads for import
# Set to number of CPU cores (e.g., 4, 8, 16)
import-threads=8

# ============================================
# CACHING SETTINGS
# ============================================

# Increase cache sizes
cache-memory=4g
query-timeout=300
query-limit-results=1000000

# ============================================
# DISK I/O SETTINGS
# ============================================

# Use SSD for storage if possible
# Point to SSD mount
storage-folder=/mnt/ssd/graphdb-data

# Increase buffer sizes for better I/O
write-buffer-size=256m
read-buffer-size=256m

# ============================================
# TRANSACTION SETTINGS
# ============================================

# Transaction timeout (increase for large imports)
# 30 minutes = 1800 seconds
transaction-timeout=1800

# Commit batch size
commit-batch-size=10000

# ============================================
# REASONING/INFERENCE SETTINGS
# ============================================

# Ruleset - use lightweight for better import performance
ruleset=rdfsplus-optimized

# Disable inference consistency checks during import
# (re-enable after import)
check-for-inconsistencies=false

# ============================================
# REPOSITORY SPECIFIC (in repo-config.ttl)
# ============================================

# Example repo-config.ttl optimizations:
#
# @prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .
# @prefix rep: <http://www.openrdf.org/config/repository#> .
# @prefix sr: <http://www.openrdf.org/config/repository/sail#> .
# @prefix sail: <http://www.openrdf.org/config/sail#> .
# @prefix owlim: <http://www.ontotext.com/trree/owlim#> .
#
# [] a rep:Repository ;
#    rep:repositoryID "my-ontology-repo" ;
#    rdfs:label "Optimized Ontology Repository" ;
#    rep:repositoryImpl [
#       rep:repositoryType "graphdb:SailRepository" ;
#       sr:sailImpl [
#          sail:sailType "graphdb:Sail" ;
#
#          # Disable inference initially for import
#          owlim:enable-inference "false" ;
#
#          # Increase entity pool
#          owlim:entity-index-size "20000000" ;
#
#          # Optimize for import
#          owlim:cache-memory "4g" ;
#          owlim:tuple-index-memory "2048m" ;
#
#          # Lightweight ruleset
#          owlim:ruleset "rdfsplus-optimized" ;
#       ]
#    ] .

# ============================================
# MONITORING
# ============================================

# Enable JMX for monitoring
-Dcom.sun.management.jmxremote
-Dcom.sun.management.jmxremote.port=9999
-Dcom.sun.management.jmxremote.authenticate=false
-Dcom.sun.management.jmxremote.ssl=false

# Enable GC logging
-Xlog:gc*:file=/var/log/graphdb/gc.log:time,uptime:filecount=10,filesize=100M

# ============================================
# NOTES
# ============================================

# After optimizing configuration:
# 1. Restart GraphDB
# 2. Use optimized import code (see OptimizedOntologyController.java)
# 3. Monitor logs: tail -f /var/log/graphdb/main.log
# 4. Check memory usage: jstat -gcutil <pid> 1000
# 5. Expected improvement: 60-70% faster imports

# For very large files (>500MB):
# - Consider splitting into chunks
# - Use GraphDB Preload (fastest method)
# - Increase heap to 32GB or more
