    <!-- CRITICAL: Block service workers BEFORE any other scripts load -->
    <script>
      // Prevent service worker registration in VSCode webview context
      // This MUST run before ANY other script
      (function() {
        'use strict';
        
        // Suppress all service worker related errors and warnings
        const originalError = console.error;
        const originalWarn = console.warn;
        const originalLog = console.log;
        
        console.error = function(...args) {
          const msg = String(args[0] || '');
          if (msg.includes('service worker') || msg.includes('ServiceWorker') || 
              msg.includes('Could not register') || msg.includes('InvalidStateError') ||
              msg.includes('Webview fatal error') || msg.includes('Failed to register')) {
            return; // Completely suppress
          }
          originalError.apply(console, args);
        };
        
        console.warn = function(...args) {
          const msg = String(args[0] || '');
          if (msg.includes('service worker') || msg.includes('ServiceWorker')) {
            return; // Completely suppress
          }
          originalWarn.apply(console, args);
        };
        
        console.log = function(...args) {
          const msg = String(args[0] || '');
          if (msg.includes('Webview fatal error') && msg.includes('service worker')) {
            return; // Completely suppress
          }
          originalLog.apply(console, args);
        };
        
        // Completely remove and block service worker API
        if ('serviceWorker' in navigator) {
          try {
            // Delete first
            delete navigator.serviceWorker;
            
            // Then define a frozen mock that does nothing
            Object.defineProperty(navigator, 'serviceWorker', {
              value: Object.freeze({
                register: () => Promise.resolve({
                  installing: null,
                  waiting: null,
                  active: null,
                  addEventListener: () => {},
                  removeEventListener: () => {},
                  unregister: () => Promise.resolve(true),
                  update: () => Promise.resolve()
                }),
                getRegistration: () => Promise.resolve(undefined),
                getRegistrations: () => Promise.resolve([]),
                ready: new Promise(() => {}), // Never resolves
                addEventListener: () => {},
                removeEventListener: () => {},
                controller: null
              }),
              configurable: false,
              writable: false,
              enumerable: false
            });
          } catch (e) {
            // Fallback: just override methods
            try {
              navigator.serviceWorker.register = () => Promise.resolve({});
              navigator.serviceWorker.getRegistration = () => Promise.resolve(undefined);
              navigator.serviceWorker.getRegistrations = () => Promise.resolve([]);
            } catch (err) {
              // Last resort: do nothing
            }
          }
        }
        
        // Catch all unhandled promise rejections
        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason) {
            const msg = String(event.reason.message || event.reason || '');
            if (msg.includes('service worker') || msg.includes('ServiceWorker') ||
                msg.includes('Could not register') || msg.includes('InvalidStateError')) {
              event.preventDefault();
              event.stopPropagation();
              return false;
            }
          }
        }, true);
        
        // Also catch synchronous errors
        window.addEventListener('error', function(event) {
          if (event.message) {
            const msg = String(event.message);
            if (msg.includes('service worker') || msg.includes('ServiceWorker') ||
                msg.includes('Could not register') || msg.includes('InvalidStateError')) {
              event.preventDefault();
              event.stopPropagation();
              return false;
            }
          }
        }, true);
      })();
    </script>
