# Server Configuration
server.port=8087
spring.application.name=ontology-plugin-service

# Database (PostgreSQL)
spring.datasource.url=${ONTOCODE_DB_URL:jdbc:postgresql://postgres:5432/ontocode?socketTimeout=10&connectTimeout=3}
spring.datasource.username=${ONTOCODE_DB_USER:ontocode}
spring.datasource.password=${ONTOCODE_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${ONTOCODE_DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.flyway.enabled=${ONTOCODE_FLYWAY_ENABLED:true}
ontocode.db.impl=${ONTOCODE_DB_IMPL:jdbc}

# File store (plugin bundles and ontology files are read through it)
ontocode.blobs.dir=${ONTOCODE_BLOBS_DIR:./data/blobs}
ontocode.blobs.storage=${ONTOCODE_BLOBS_STORAGE:disk}

# Editor Service URL (use localhost for non-Docker, owl-editor for Docker)
ontology.editor.url=${ONTOLOGY_EDITOR_URL:http://localhost:8083}

ontocode.reasoner-worker.enabled=${ONTOCODE_REASONER_WORKER_ENABLED:false}
ontocode.reasoner-worker.url=${ONTOCODE_REASONER_WORKER_URL:http://reasoner-worker:8088}
ontocode.internal.token=${ONTOCODE_INTERNAL_TOKEN:ontocode-internal}

# Upload limits
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB

# JWT Configuration (same secret as ontology-auth for validation)
jwt.secret=${JWT_SECRET}

# Logging
logging.level.root=INFO
logging.level.self.research.ontology.plugins=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# HTTP Connection Timeouts - Extended for reasoner operations (classification can take several minutes)
server.tomcat.connection-timeout=1800000
server.connection-timeout=1800s
spring.mvc.async.request-timeout=1800000

# Actuator (for health checks)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
