# Server Configuration
server.port=8087
spring.application.name=ontology-plugin-service

# Break sslBundleRegistry <-> MongoClient circular dependency (Spring Boot 3.4)
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.ssl.SslAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.ssl.SslHealthContributorAutoConfiguration

# MongoDB Configuration (reuse existing MongoDB instance)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ontology}
spring.data.mongodb.auto-index-creation=true

# Editor Service URL (use localhost for non-Docker, owl-editor for Docker)
ontology.editor.url=${ONTOLOGY_EDITOR_URL:http://localhost:8083}

# GridFS Configuration
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB

# JWT Configuration (same secret as ontology-auth for validation)
jwt.secret=${JWT_SECRET}

# Logging
logging.level.root=INFO
logging.level.self.research.ontology.plugins=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# HTTP Connection Timeouts - Extended for reasoner operations (classification can take several minutes)
server.tomcat.connection-timeout=1800000
server.connection-timeout=1800s
spring.mvc.async.request-timeout=1800000

# Actuator (for health checks)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
