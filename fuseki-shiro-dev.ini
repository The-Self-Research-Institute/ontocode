# Fuseki dev shiro.ini — allows anonymous SPARQL access (dev only, never use in production)
[main]
ssl.enabled = false

[users]
admin = admin, admin

[roles]
admin = *

[urls]
# Management endpoints require admin
/$/metrics  = anon
/$/ping     = anon
/$/server   = authcBasic,user[admin]
/$/datasets = authcBasic,user[admin]
/$/backup   = authcBasic,user[admin]
/$/compact  = authcBasic,user[admin]
# All SPARQL endpoints (query, update, GSP) are open for local dev
/**         = anon
