# Async Configuration
spring.task.execution.pool.core-size=8
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=500
spring.task.execution.thread-name-prefix=async-

# ========== PERFORMANCE OPTIMIZATIONS FOR LARGE FILES ==========
# Multipart file upload configuration - support very large ontology files
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
spring.servlet.multipart.file-size-threshold=10MB
# Use project data dir for temp files instead of system temp (avoids filling OS temp partition)
spring.servlet.multipart.location=${ontocode.data.dir:./data}/tmp

# HTTP Connection Timeouts - extended for large file processing
server.tomcat.connection-timeout=1800000
server.connection-timeout=1800s
spring.mvc.async.request-timeout=1800000

# Tomcat thread pool optimization for concurrent uploads
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.max-connections=10000

# Buffer sizes for efficient I/O
server.tomcat.max-http-post-size=1073741824
server.tomcat.max-swallow-size=1073741824

# JVM Memory optimization (set in Docker/deployment)
# -Xms2g -Xmx4g -XX:+UseG1GC -XX:MaxGCPauseMillis=200
# ===============================================================

# Logging
logging.level.root=INFO
logging.level.self.research.ontology.owlEditor=DEBUG
logging.level.org.neo4j=DEBUG
logging.level.org.springframework.web.reactive.function.client=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/owl-editor.log

# Spring Boot Configuration
spring.profiles.active=dev
spring.devtools.restart.enabled=true

# Bean Definition Overriding
spring.main.allow-bean-definition-overriding=true

# File Upload Configuration - Support large ontology files up to 1GB
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
spring.servlet.multipart.enabled=true

# Import worker (optional remote import processor)
import.worker.url=${IMPORT_WORKER_URL:}

# Management Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.indent-output=true
