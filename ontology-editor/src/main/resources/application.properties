# OntoCode OWL Editor Configuration

spring.application.name=ontology-editor
server.port=8083

# Neo4j Configuration
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:neo4jneo4j}
neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
neo4j.username=${NEO4J_USERNAME:neo4j}
neo4j.password=${NEO4J_PASSWORD:neo4jneo4j}

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ontocode}
spring.data.mongodb.auto-index-creation=true

# GraphDB Configuration (Ontotext GraphDB)
graphdb.url=${GRAPHDB_URL:http://localhost:7200}
graphdb.repository=${GRAPHDB_REPOSITORY:ontocode}
ontocode.data.dir=${DATA_DIR:./data}

# SPARQL Configuration - Using GraphDB
sparql.endpointUrl=${SPARQL_ENDPOINT:http://localhost:7200/repositories/ontocode}
sparql.updateEndpointUrl=${SPARQL_UPDATE_ENDPOINT:http://localhost:7200/repositories/ontocode/statements}
sparql.endpoint-url=${SPARQL_ENDPOINT:http://localhost:7200/repositories/ontocode}

# Application Configuration
app.base-url=${BASE_URL:http://localhost:8083}
app.auth-service-url=${AUTH_SERVICE_URL:http://localhost:8086}
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8086}

# Email Configuration (Gmail SMTP with App Password)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:sindhuja@coretopia.com}
spring.mail.password=${GMAIL_APP_PASSWORD:***REMOVED-GMAIL-APP-PASSWORD***}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.email.enabled=${EMAIL_ENABLED:true}

# Async Configuration
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100

# Logging
logging.level.root=INFO
logging.level.self.research.ontology.owlEditor=DEBUG
logging.level.org.neo4j=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/owl-editor.log

# Spring Boot Configuration
spring.profiles.active=dev
spring.devtools.restart.enabled=true

# Bean Definition Overriding
spring.main.allow-bean-definition-overriding=true

# File Upload Configuration - Support large ontology files up to 1GB
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
spring.servlet.multipart.enabled=true

# Management Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.indent-output=true