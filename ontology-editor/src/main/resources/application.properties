# OntoCode OWL Editor Configuration

spring.application.name=ontology-editor
server.port=8083

# Tomcat Configuration - Allow encoded slashes for hierarchical project IDs
server.tomcat.relaxed-path-chars=|,{,},[,]
server.tomcat.relaxed-query-chars=|,{,},[,]
tomcat.util.http.parser.HttpParser.requestTargetAllow=|{}

# Neo4j Configuration - DISABLED (using optimized GraphDB instead)
# spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
# spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
# spring.neo4j.authentication.password=${NEO4J_PASSWORD:neo4jneo4j}
# neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
# neo4j.username=${NEO4J_USERNAME:neo4j}
# neo4j.password=${NEO4J_PASSWORD:neo4jneo4j}

# Cache Configuration - HIGH PERFORMANCE!
# In-memory caching for instant graph and class hierarchy responses (shared across all users)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=15m
spring.cache.cache-names=graphCache,topLevelClasses,classChildren,ontologyProperties,ontologyIndividuals,classInstanceCounts

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ontocode}
spring.data.mongodb.auto-index-creation=true

# GraphDB Configuration (Ontotext GraphDB)
graphdb.url=${GRAPHDB_URL:http://localhost:7200}
graphdb.repository=${GRAPHDB_REPOSITORY:ontocode}
graphdb.import.dir=${GRAPHDB_IMPORT_DIR:/opt/graphdb-import}
ontocode.data.dir=${DATA_DIR:./data}

# SPARQL Configuration - Using GraphDB
sparql.endpointUrl=${SPARQL_ENDPOINT:http://localhost:7200/repositories/ontocode}
sparql.updateEndpointUrl=${SPARQL_UPDATE_ENDPOINT:http://localhost:7200/repositories/ontocode/statements}
sparql.endpoint-url=${SPARQL_ENDPOINT:http://localhost:7200/repositories/ontocode}

# Application Configuration
app.base-url=${BASE_URL:http://localhost:8083}
app.auth-service-url=${AUTH_SERVICE_URL:http://localhost:8086}
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8086}

# Email Configuration (Gmail SMTP with App Password)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:sindhuja@coretopia.com}
spring.mail.password=${GMAIL_APP_PASSWORD:***REMOVED-GMAIL-APP-PASSWORD***}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.email.enabled=${EMAIL_ENABLED:true}

# Jira Integration Configuration (for issue reporting)
jira.enabled=${JIRA_ENABLED:true}
jira.cloud.url=${JIRA_CLOUD_URL:https://coretopia.atlassian.net}
jira.user.email=${JIRA_USER_EMAIL:uma@coretopia.com}
jira.api.token=${JIRA_API_TOKEN:ATATT3xFfGF0fhZLilL7hxxMAXQcjCEQXmkcVVMIk50av6aSqaDwoY6HOqhuriEGAL7uSwL3oFh6p4n9Vssrq6u67kAKi6nxUAICruIUtJDTKyUhM0ibNyq-S3DJVM88v-VkOX5jYc-yCCjIH7hQ9NYNWbQQLnPJngbbCLGOuzii6WkIL9s4G7g=6CEB1011}
