# OntoCode OWL Editor Configuration

spring.application.name=ontology-editor
server.port=8083

# Tomcat Configuration - Allow encoded slashes for hierarchical project IDs
server.tomcat.relaxed-path-chars=|,{,},[,]
server.tomcat.relaxed-query-chars=|,{,},[,]
tomcat.util.http.parser.HttpParser.requestTargetAllow=|{}


# Cache Configuration - HIGH PERFORMANCE!
# In-memory caching for instant graph and class hierarchy responses (shared across all users).
# Larger maximumSize + longer TTL help heavy multi-user browsing hit the cache instead of GraphDB.
# Mutations evict the relevant caches explicitly, so long TTL is safe.
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=5000,expireAfterWrite=1h
spring.cache.cache-names=graphCache,topLevelClasses,classChildren,allClasses,ontologyProperties,ontologyIndividuals,classInstanceCounts,classDetails,classAnnotations,classInstances,individualCount,debugInfo

# Phase C: per-project in-memory SPARQL cache (RDF4J MemoryStore mirror).
# Serves reads from a local MemoryStore copy of each project's named graph.
# Evict-on-write keeps writes full speed (SPARQL UPDATE hits Fuseki directly).
#  - enabled: master switch
#  - max-projects: LRU ceiling (each project ~200-400 MB RAM); increase when RAM allows
#  - max-triples: per-project hard cap, above which the project is NOT cached
#  - no-cache-threshold: projects above this size bypass the in-memory cache entirely
#    and are served directly from Fuseki, avoiding 60s+ blocking reloads on eviction
ontocode.cache.memstore.enabled=${ONTOCODE_MEMCACHE_ENABLED:true}
ontocode.cache.memstore.max-projects=${ONTOCODE_MEMCACHE_MAX_PROJECTS:3}
ontocode.cache.memstore.max-triples=${ONTOCODE_MEMCACHE_MAX_TRIPLES:5000000}
ontocode.cache.memstore.no-cache-threshold=${ONTOCODE_MEMCACHE_NO_CACHE_THRESHOLD:3000000}

# Protégé-parity class hierarchy snapshots (OWLAPI build after import, served to web UI)
ontocode.hierarchy.snapshot.enabled=${ONTOCODE_HIERARCHY_SNAPSHOT_ENABLED:true}
# When false, web falls back to legacy Fuseki SPARQL top-level/children if snapshot not ready
ontocode.hierarchy.snapshot.legacy-sparql-fallback=${ONTOCODE_HIERARCHY_LEGACY_SPARQL:true}

# Cloud fast-open: OWLAPI in-memory model available via POST /api/ontology/warm (manual).
# When false (web default), import/open uses Fuseki + Mongo hierarchy snapshots only — low heap.
ontocode.fastopen.enabled=${ONTOCODE_FASTOPEN_ENABLED:true}
# Auto-warm at import/open. False on web — user triggers POST /warm when they want fast editor.
ontocode.fastopen.auto-warm=${ONTOCODE_FASTOPEN_AUTO_WARM:false}
# Skip structural-reasoner precompute on cloud — much faster for large ontologies (90k+ classes).
ontocode.fastopen.skip-reasoner-precompute=${ONTOCODE_FASTOPEN_SKIP_REASONER:true}

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ontocode}
spring.data.mongodb.auto-index-creation=true

# Fuseki Configuration (Apache Jena Fuseki + TDB2)
ontocode.fuseki.queryEndpoint=${FUSEKI_QUERY_ENDPOINT:http://localhost:3030/ontocode/query}
ontocode.fuseki.updateEndpoint=${FUSEKI_UPDATE_ENDPOINT:http://localhost:3030/ontocode/update}
ontocode.fuseki.gspEndpoint=${FUSEKI_GSP_ENDPOINT:http://localhost:3030/ontocode/data}
ontocode.fuseki.adminUser=${FUSEKI_ADMIN_USER:admin}
ontocode.fuseki.adminPassword=${FUSEKI_ADMIN_PASSWORD:admin}
# Files smaller than this use the shared Fuseki dataset (named graph per project).
# Skips slow per-project TDB2 dataset creation. GO-plus and other large files get a dedicated dataset.
ontocode.fuseki.shared-graph.max-file-mb=${FUSEKI_SHARED_GRAPH_MAX_MB:50}
ontocode.data.dir=${DATA_DIR:./data}

# SPARQL Configuration - Using Fuseki
sparql.endpointUrl=${FUSEKI_QUERY_ENDPOINT:http://localhost:3030/ontocode/query}
sparql.updateEndpointUrl=${FUSEKI_UPDATE_ENDPOINT:http://localhost:3030/ontocode/update}
sparql.endpoint-url=${FUSEKI_QUERY_ENDPOINT:http://localhost:3030/ontocode/query}

# Application Configuration
app.base-url=${BASE_URL:http://localhost:8083}
app.auth-service-url=${AUTH_SERVICE_URL:http://localhost:8086}
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8086}

# Email Configuration (Gmail SMTP with App Password)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:noreply@example.com}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.email.enabled=${EMAIL_ENABLED:true}

# Jira Integration Configuration (for issue reporting)
jira.enabled=${JIRA_ENABLED:true}
jira.cloud.url=${JIRA_CLOUD_URL:https://coretopia.atlassian.net}
jira.user.email=${JIRA_USER_EMAIL:noreply@example.com}
jira.api.token=${JIRA_API_TOKEN}
jira.project.key=${JIRA_PROJECT_KEY:TSRI}
jira.epic.key=${JIRA_EPIC_KEY:TSRI-103}
jira.issue.type=${JIRA_ISSUE_TYPE:Task}

# Async Configuration
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=200
spring.task.execution.thread-name-prefix=async-

# ========== PERFORMANCE OPTIMIZATIONS FOR LARGE FILES ==========
# Multipart file upload configuration - support very large ontology files
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
spring.servlet.multipart.file-size-threshold=10MB
# Use project data dir for temp files instead of system temp (avoids filling OS temp partition)
spring.servlet.multipart.location=${ontocode.data.dir:./data}/tmp

# HTTP Connection Timeouts - extended for uploads up to 1GB
server.tomcat.connection-timeout=${ONTOLOGY_HTTP_TIMEOUT_MS:7200000}
server.connection-timeout=${ONTOLOGY_HTTP_TIMEOUT_SECONDS:7200s}
spring.mvc.async.request-timeout=${ONTOLOGY_HTTP_TIMEOUT_MS:7200000}

# Tomcat thread pool optimization
# threads.max=300 lets ~300 requests execute concurrently (classDetails offloads
# to QUERY_POOL so Tomcat threads are mostly just awaiting completion).
# accept-count=500 is the OS-level backlog before rejecting connections.
# Together these allow ~800 requests in-flight before refusing — enough for
# ~1000 users at typical click rates once request coalescing is in play.
server.tomcat.threads.max=300
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=500
server.tomcat.max-connections=4000

# Buffer sizes for efficient I/O
server.tomcat.max-http-post-size=1073741824
server.tomcat.max-swallow-size=1073741824

# JVM Memory optimization (set in Docker/deployment)
# -Xms2g -Xmx4g -XX:+UseG1GC -XX:MaxGCPauseMillis=200
# ===============================================================

# Logging — configured via logback-spring.xml for multi-file logging
# Override ROOT level via LOGGING_LEVEL_ROOT env variable
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}

# Spring Boot Configuration
spring.profiles.active=dev
spring.devtools.restart.enabled=true

# Bean Definition Overriding
spring.main.allow-bean-definition-overriding=true

spring.servlet.multipart.enabled=true

# Import worker (optional remote import processor)
import.worker.url=${IMPORT_WORKER_URL:}
# Max concurrent file imports. Controlled via ONTOCODE_IMPORT_MAX_CONCURRENT env var.
# t3.large=1  t3.xlarge=2  t3.2xlarge=3
ontocode.import.max-concurrent=${ONTOCODE_IMPORT_MAX_CONCURRENT:1}

# Reasoner: max ontology size (triples) allowed for in-memory OWL API reasoning.
# Ontologies above this threshold are rejected before the StringWriter export that would OOM.
# t3.large: 500000  t3.xlarge+: 1000000 (default)
ontocode.reasoner.max-triples=${ONTOCODE_REASONER_MAX_TRIPLES:1000000}

# Management Endpoints
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=always
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,mongo,diskSpace

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.indent-output=true
