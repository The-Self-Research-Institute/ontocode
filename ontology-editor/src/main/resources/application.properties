# OntoCode OWL Editor Configuration

spring.application.name=ontology-editor
server.port=8083

# Neo4j Configuration
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:neo4jneo4j}
neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
neo4j.username=${NEO4J_USERNAME:neo4j}
neo4j.password=${NEO4J_PASSWORD:neo4jneo4j}

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ontocode}
spring.data.mongodb.auto-index-creation=true

# TDB2 Configuration (Apache Jena) - OPEN SOURCE
tdb2.data-path=${TDB2_DATA_PATH:./data/tdb2}
tdb2.enabled=true

# SPARQL Configuration - Using Apache Jena Fuseki (Open Source)
sparql.endpointUrl=${SPARQL_ENDPOINT:http://localhost:3030/ontology/query}
sparql.updateEndpointUrl=${SPARQL_UPDATE_ENDPOINT:http://localhost:3030/ontology/update}

# Application Configuration
app.base-url=${BASE_URL:http://localhost:8083}
app.auth-service-url=${AUTH_SERVICE_URL:http://localhost:8086}

# Async Configuration
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100

# Logging
logging.level.root=INFO
logging.level.self.research.ontology.owlEditor=DEBUG
logging.level.org.neo4j=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/owl-editor.log

# Spring Boot Configuration
spring.profiles.active=dev
spring.devtools.restart.enabled=true

# Bean Definition Overriding
spring.main.allow-bean-definition-overriding=true

# File Upload Configuration - Support large ontology files up to 1GB
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
spring.servlet.multipart.enabled=true

# Management Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

sparql.endpoint-url=http://localhost:3030/mydb/sparql



spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.indent-output=true