# Docker / production editor profile — JWT required on mutating APIs.

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
ontocode.editor.require-jwt=${ONTOCODE_EDITOR_REQUIRE_JWT:true}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://admin:changeme123@mongo:27017/ontocode?authSource=admin}
spring.data.mongodb.auto-index-creation=false

ontocode.fuseki.queryEndpoint=${FUSEKI_QUERY_ENDPOINT:http://fuseki:3030/ontocode/query}
ontocode.fuseki.updateEndpoint=${FUSEKI_UPDATE_ENDPOINT:http://fuseki:3030/ontocode/update}
ontocode.fuseki.gspEndpoint=${FUSEKI_GSP_ENDPOINT:http://fuseki:3030/ontocode/data}
ontocode.fuseki.adminPassword=${FUSEKI_ADMIN_PASSWORD:admin}

ontocode.import.max-concurrent=${ONTOCODE_IMPORT_MAX_CONCURRENT:1}

# Dedicated reasoner worker (DL Query + Reasoner jobs). When enabled, editor forwards heavy reasoning to worker.
ontocode.reasoner-worker.enabled=${ONTOCODE_REASONER_WORKER_ENABLED:false}
ontocode.reasoner-worker.url=${ONTOCODE_REASONER_WORKER_URL:http://reasoner-worker:8088}
ontocode.internal.token=${ONTOCODE_INTERNAL_TOKEN:ontocode-internal}
