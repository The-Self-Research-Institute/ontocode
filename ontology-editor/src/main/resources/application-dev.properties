# Local development profile for the editor service.
# Activate with: SPRING_PROFILES_ACTIVE=dev

# Use the same MongoDB as auth/docker (file_metadata + GridFS live on 27018).
spring.data.mongodb.uri=${MONGODB_URI:mongodb://admin:changeme123@localhost:27018/ontocode?authSource=admin}

# Disable auto-index creation to avoid TTL index conflicts on local MongoDB.
spring.data.mongodb.auto-index-creation=false

# Jira — dummy values for local dev (issue reporting won't work, ontology features will)
jira.api.token=${JIRA_API_TOKEN:local_dev_placeholder}

# SMTP not configured locally — don't mark overall health DOWN for load tests
management.health.mail.enabled=false
