# Local development profile for the editor service.
# Activate with: SPRING_PROFILES_ACTIVE=dev
# Hybrid: docker compose up postgres fuseki, then mvn spring-boot:run (see scripts/start-hybrid.ps1)

# Local PostgreSQL (set ONTOCODE_DB_PASSWORD; there is no default password)
spring.datasource.url=${ONTOCODE_DB_URL:jdbc:postgresql://localhost:5432/ontocode?socketTimeout=10&connectTimeout=3}

# Fuseki (Docker on 3030)
ontocode.fuseki.queryEndpoint=${FUSEKI_QUERY_ENDPOINT:http://localhost:3030/ontocode/query}
ontocode.fuseki.updateEndpoint=${FUSEKI_UPDATE_ENDPOINT:http://localhost:3030/ontocode/update}
ontocode.fuseki.gspEndpoint=${FUSEKI_GSP_ENDPOINT:http://localhost:3030/ontocode/data}
ontocode.fuseki.adminPassword=${FUSEKI_ADMIN_PASSWORD:admin}

# One large import at a time on dev machines — prevents OOM/timeouts
ontocode.import.max-concurrent=${ONTOCODE_IMPORT_MAX_CONCURRENT:1}

# Draft classification/consistency can't use the async reasoner-worker queue (the worker has
# no way to prove draft access to the editor yet — see explain-entailment's same limitation),
# so it always runs synchronously on the request thread, capped by this timeout. The base
# default (45s) is tuned for a shared cloud deployment; a local dev box testing a non-trivial
# ontology with HermiT needs much more room before being cut off.
ontocode.reasoner.operation-timeout-ms=${ONTOCODE_REASONER_OPERATION_TIMEOUT_MS:180000}

# Local dev: JWT not required on :8083 (load tests use ownerEmail); gateway enforces in docker profile
jwt.secret=${JWT_SECRET:ZGV2ZWxvcG1lbnQtb250b2NvZGUtand0LXNlY3JldC1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQ=}
ontocode.editor.require-jwt=false

# OpenProject — dummy token for local dev (issue reporting won't work, ontology features will);
# parent id still set correctly in case a real OPENPROJECT_API_KEY is supplied.
openproject.api.key=${OPENPROJECT_API_KEY:local_dev_placeholder}
openproject.parent.id=${OPENPROJECT_PARENT_ID:TSRI-325}

# SMTP not configured locally — don't mark overall health DOWN for load tests
management.health.mail.enabled=false
