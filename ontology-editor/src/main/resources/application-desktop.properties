# ──────────────────────────────────────────────────────────────────────────────
# OntoCode OWL Editor — Desktop profile
#
# Activated by:  --spring.profiles.active=desktop
# Electron sets all endpoints via command-line args; these are safe defaults
# in case the app is launched manually.
# ──────────────────────────────────────────────────────────────────────────────

# Desktop mode flag — read by FreeViewOnlyInterceptor and DesktopController
ontocode.desktop.mode=true

# ── Server ────────────────────────────────────────────────────────────────────
server.port=18083

# ── MongoDB (started by Electron on a non-default port) ──────────────────────
spring.data.mongodb.uri=mongodb://127.0.0.1:27117/ontocode-desktop

# ── Fuseki (started by Electron on a non-default port) ───────────────────────
ontocode.fuseki.queryEndpoint=http://127.0.0.1:13030/ontocode/query
ontocode.fuseki.updateEndpoint=http://127.0.0.1:13030/ontocode/update
ontocode.fuseki.gspEndpoint=http://127.0.0.1:13030/ontocode/data
ontocode.fuseki.adminUser=admin
ontocode.fuseki.adminPassword=desktop-local

sparql.endpointUrl=http://127.0.0.1:13030/ontocode/query
sparql.updateEndpointUrl=http://127.0.0.1:13030/ontocode/update
sparql.endpoint-url=http://127.0.0.1:13030/ontocode/query

# ── Auth service (desktop supplies its own stubs) ─────────────────────────────
# Point at ourselves so the editor can call /api/auth/* on the same port
app.auth-service-url=http://127.0.0.1:18083
auth.service.url=http://127.0.0.1:18083

# ── Email / SMTP — disabled on desktop ───────────────────────────────────────
app.email.enabled=false
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=noop@localhost
spring.mail.password=noop
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.mail.MailSenderValidatorAutoConfiguration,\
  org.springframework.boot.autoconfigure.ssl.SslAutoConfiguration

# ── Jira — disabled on desktop ────────────────────────────────────────────────
jira.enabled=false
jira.cloud.url=http://localhost
jira.user.email=noop@localhost
jira.api.token=noop
jira.project.key=NOOP
jira.epic.key=NOOP-0
jira.issue.type=Task

# ── Spring health / actuator ─────────────────────────────────────────────────
# Exclude the mail health indicator that would fail without SMTP
management.health.mail.enabled=false
management.endpoint.health.group.readiness.include=readinessState,mongo,diskSpace

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.self.research=INFO
logging.level.org.springframework.boot=INFO

# ── devtools — off in desktop production mode ─────────────────────────────────
spring.devtools.restart.enabled=false

# ── Reasoner limits — tuned for a single desktop user ────────────────────────
# Desktop users may work with large ontologies; allow more triples than the
# cloud default (cloud default is set per instance type in the server properties).
# 5M matches the reasoner-worker's elk-max-triples default — ELK can handle
# large biomedical ontologies (MONDO ~3.1M, GO ~3.5M) with sufficient heap.
ontocode.reasoner.max-triples=5000000
ontocode.import.max-concurrent=2

# ── Cache — smaller footprint on desktop ─────────────────────────────────────
# Reduce LRU project cache; a single desktop user has one project open at a time.
ontocode.cache.memstore.max-projects=1

# Desktop: auto-warm OWLAPI on import/open (Protégé-style fast path).
ontocode.fastopen.auto-warm=true

# Protégé-style desktop: open via OWLAPI first; Fuseki sync is lazy (SPARQL, graph, etc.)
ontocode.desktop.owlapi-first=true
