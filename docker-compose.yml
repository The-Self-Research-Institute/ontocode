# OntoCode Development Docker Compose
# Use docker-compose.production.yml for production deployments
# This file is for quick local development and testing

services:
  # MongoDB Database
  mongo:
    image: mongo:6
    container_name: ontocode-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-ontocode}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme123}
    networks:
      - ontology-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh "mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme123}@localhost:27017/admin" --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # GraphDB (RDF Triple Store)
  graphdb:
    image: ontotext/graphdb:11.1.1
    container_name: ontocode-graphdb
    restart: unless-stopped
    ports:
      - "7200:7200"
    environment:
      GDB_HEAP_SIZE: 2g
      GDB_LICENSE_PATH: /opt/graphdb
    volumes:
      - graphdb-data:/opt/graphdb/data
      # Ensure this license file exists in your root folder!
      - ${GDB_LICENSE_FILE:-./CORETOPIA_GRAPHDB_FREE_v11.1.license}:/opt/graphdb/home/conf/graphdb.license:ro
    networks:
      - ontology-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7200/rest/repositories"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # GraphDB Repository Initializer (UPDATED FIX)
  graphdb-init:
    image: curlimages/curl:latest
    container_name: ontocode-graphdb-init
    depends_on:
      graphdb:
        condition: service_healthy
    volumes:
      # Points to the NEW script to bypass Windows cache issues
      - ./scripts/init-repo.sh:/init-repo.sh:ro
    networks:
      - ontology-net
    command: sh /init-repo.sh
    restart: "no"

  # Authentication Service
  auth:
    build:
      context: .
      dockerfile: Dockerfile.auth
      args:
        - BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        - VCS_REF=$(git rev-parse --short HEAD)
    image: ontocode-auth:latest
    container_name: ontocode-auth
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme123}@mongo:27017/${MONGODB_DATABASE:-ontocode}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-b250b2NvZGUtc3VwZXItc2VjcmV0LWp3dC1rZXktMjAyNC1taW5pbXVtLTI1Ni1iaXRzLXJlcXVpcmVkIQ==}
      SPRING_PROFILES_ACTIVE: dev
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - ontology-net

  # API Gateway
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
      args:
        - BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        - VCS_REF=$(git rev-parse --short HEAD)
    image: ontocode-gateway:latest
    container_name: ontocode-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-b250b2NvZGUtc3VwZXItc2VjcmV0LWp3dC1rZXktMjAyNC1taW5pbXVtLTI1Ni1iaXRzLXJlcXVpcmVkIQ==}
      AUTH_SERVICE_URL: http://auth:8086
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
    depends_on:
      auth:
        condition: service_started
    networks:
      - ontology-net

  # Ontology Editor Service
  owl-editor:
    build:
      context: .
      dockerfile: Dockerfile.editor
      args:
        - BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        - VCS_REF=$(git rev-parse --short HEAD)
    image: ontocode-editor:latest
    container_name: ontocode-editor
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme123}@mongo:27017/${MONGODB_DATABASE:-ontocode}?authSource=admin
      GRAPHDB_URL: http://graphdb:7200
      GRAPHDB_REPOSITORY: ${GRAPHDB_REPOSITORY:-ontocode}
      SPRING_PROFILES_ACTIVE: dev
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
    depends_on:
      - mongo
      - graphdb
    networks:
      - ontology-net

  # SWRL Rules Service
  swrl-service:
    build:
      context: .
      dockerfile: Dockerfile.swrl
      args:
        - BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        - VCS_REF=$(git rev-parse --short HEAD)
    image: ontocode-swrl:latest
    container_name: ontocode-swrl
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme123}@mongo:27017/${MONGODB_DATABASE:-ontocode}?authSource=admin
      GRAPHDB_URL: http://graphdb:7200
      GRAPHDB_REPOSITORY: ${GRAPHDB_REPOSITORY:-ontocode}
      ONTOLOGY_EDITOR_URL: http://owl-editor:8083
      SPRING_PROFILES_ACTIVE: dev
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
    depends_on:
      - mongo
      - graphdb
    networks:
      - ontology-net

  # Plugin Service
  plugin-service:
    build:
      context: .
      dockerfile: Dockerfile.plugin
      args:
        - BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        - VCS_REF=$(git rev-parse --short HEAD)
    image: ontocode-plugin:latest
    container_name: ontocode-plugin
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme123}@mongo:27017/${MONGODB_DATABASE:-ontocode}?authSource=admin
      SPRING_DATA_MONGODB_DATABASE: ${MONGODB_DATABASE:-ontocode}
      JWT_SECRET: ${JWT_SECRET:-b250b2NvZGUtc3VwZXItc2VjcmV0LWp3dC1rZXktMjAyNC1taW5pbXVtLTI1Ni1iaXRzLXJlcXVpcmVkIQ==}
      SPRING_PROFILES_ACTIVE: dev
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
    depends_on:
      - mongo
    networks:
      - ontology-net

  # Plugin Initialization Service
  plugin-init:
    build:
      context: .
      dockerfile: Dockerfile.plugin-init
    container_name: ontocode-plugin-init
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme123}@mongo:27017/${MONGODB_DATABASE:-ontocode}?authSource=admin
      MONGODB_DATABASE: ${MONGODB_DATABASE:-ontocode}
    depends_on:
      mongo:
        condition: service_healthy
      plugin-service:
        condition: service_started
    networks:
      - ontology-net

volumes:
  mongo-data:
  graphdb-data:

networks:
  ontology-net:
    driver: bridge