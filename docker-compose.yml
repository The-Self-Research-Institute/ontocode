version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: ontocode-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
      - ./scripts/setup-mongodb.js:/docker-entrypoint-initdb.d/setup.js:ro
      - ./backups:/backups
    environment:
      MONGO_INITDB_DATABASE: ontocode
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
    networks:
      - ontocode-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/ontocode --quiet
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Backend Service
  backend:
    build:
      context: ./backend/ontology-editor
      dockerfile: ../../docker/Dockerfile.backend
    container_name: ontocode-backend
    restart: always
    ports:
      - "8086:8086"
    environment:
      # MongoDB
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme}@mongodb:27017/ontocode?authSource=admin
      
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80}
      
      # Application
      SPRING_PROFILES_ACTIVE: production
      
      # Logging
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_FILE_NAME: /app/logs/ontocode.log
      
      # JVM Options
      JAVA_OPTS: -Xms512m -Xmx2g -XX:+UseG1GC
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - backend-logs:/app/logs
      - plugin-data:/app/plugins
    networks:
      - ontocode-network
    healthcheck:
      test: curl -f http://localhost:8086/actuator/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Plugin Service
  plugin-service:
    build:
      context: ./ontology-plugin-service
      dockerfile: Dockerfile
    container_name: ontocode-plugin-service
    restart: always
    ports:
      - "8087:8087"
    environment:
      # MongoDB
      SPRING_DATA_MONGODB_HOST: mongodb
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: ontology
      SPRING_DATA_MONGODB_AUTHENTICATION-DATABASE: admin
      SPRING_DATA_MONGODB_USERNAME: ${MONGO_ROOT_USER:-admin}
      SPRING_DATA_MONGODB_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}

      # JWT Secret (same as auth service)
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-min-256-bits-change-in-production}

      # Application
      SPRING_PROFILES_ACTIVE: production

      # Logging
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_SELF_RESEARCH_ONTOLOGY_PLUGINS: DEBUG
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - plugin-storage:/app/storage
    networks:
      - ontocode-network
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8087/actuator/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${API_BASE_URL:-http://localhost:8086}
    container_name: ontocode-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
      plugin-service:
        condition: service_healthy
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - ontocode-network
    healthcheck:
      test: curl -f http://localhost/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy (Optional - for advanced routing)
  nginx-proxy:
    image: nginx:alpine
    container_name: ontocode-nginx-proxy
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx-proxy.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - ontocode-network
    profiles:
      - with-proxy

  # MongoDB Express (Optional - for database management)
  mongo-express:
    image: mongo-express:latest
    container_name: ontocode-mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-pass}
    depends_on:
      - mongodb
    networks:
      - ontocode-network
    profiles:
      - with-admin-tools

  # Redis Cache (Optional - for future caching)
  redis:
    image: redis:7-alpine
    container_name: ontocode-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ontocode-network
    healthcheck:
      test: redis-cli ping || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - with-cache

volumes:
  mongodb-data:
    driver: local
  mongodb-config:
    driver: local
  backend-logs:
    driver: local
  plugin-data:
    driver: local
  plugin-storage:
    driver: local
  redis-data:
    driver: local

networks:
  ontocode-network:
    driver: bridge