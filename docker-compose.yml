# OntoCode Development Docker Compose
# Use docker-compose.production.yml for production deployments
# This file is for quick local development and testing

services:
  # MongoDB Database
  mongo:
    image: mongo:6
    container_name: ontocode-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ontocode
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: changeme
    networks:
      - ontology-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/ontocode --quiet
      interval: 30s
      timeout: 10s
      retries: 3

  # GraphDB (RDF Triple Store)
  graphdb:
    image: ontotext/graphdb:10.7.1
    container_name: ontocode-graphdb
    restart: unless-stopped
    ports:
      - "7200:7200"
    environment:
      GDB_HEAP_SIZE: 2g
    networks:
      - ontology-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7200/rest/repositories"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Authentication Service
  auth:
    build:
      context: .
      dockerfile: Dockerfile.auth
    container_name: ontocode-auth
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      MONGODB_URI: mongodb://admin:changeme@mongo:27017/ontocode?authSource=admin
      JWT_SECRET: your-secret-key-change-this
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - ontology-net

  # API Gateway
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: ontocode-gateway
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JWT_SECRET: your-secret-key-change-this
    depends_on:
      auth:
        condition: service_started
    networks:
      - ontology-net

  # Ontology Editor Service
  owl-editor:
    build:
      context: .
      dockerfile: Dockerfile.editor
    container_name: ontocode-editor
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      MONGODB_URI: mongodb://admin:changeme@mongo:27017/ontocode?authSource=admin
      GRAPHDB_URL: http://graphdb:7200
      GRAPHDB_REPOSITORY: ontocode
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      - mongo
      - graphdb
    networks:
      - ontology-net

  # SWRL Rules Service
  swrl-service:
    build:
      context: .
      dockerfile: Dockerfile.swrl
    container_name: ontocode-swrl
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      MONGODB_URI: mongodb://admin:changeme@mongo:27017/ontocode?authSource=admin
      GRAPHDB_URL: http://graphdb:7200
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      - mongo
      - graphdb
    networks:
      - ontology-net

  # Plugin Service
  plugin-service:
    build:
      context: .
      dockerfile: Dockerfile.plugin
    container_name: ontocode-plugin
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      SPRING_DATA_MONGODB_HOST: mongo
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: ontology
      SPRING_DATA_MONGODB_USERNAME: admin
      SPRING_DATA_MONGODB_PASSWORD: changeme
      JWT_SECRET: your-secret-key-change-this
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      - mongo
    networks:
      - ontology-net

  # Plugin Initialization Service
  plugin-init:
    build:
      context: .
      dockerfile: Dockerfile.plugin-init
    container_name: ontocode-plugin-init
    environment:
      MONGODB_URI: mongodb://admin:changeme@mongo:27017/ontology?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - ontology-net
    profiles:
      - init
    # Run once and exit
    restart: "no"

volumes:
  mongo-data:

networks:
  ontology-net:
    driver: bridge
