# OntoCode Development Docker Compose
# Use docker-compose.production.yml for production deployments
# This file is for quick local development and testing

services:
  # MongoDB Database
  mongo:
    image: mongo:6
    container_name: ontocode-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-ontocode}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme123}
    networks:
      - ontology-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh "mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme123}@localhost:27017/admin" --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # GraphDB (RDF Triple Store) - with embedded license
  graphdb:
    image: ${DOCKER_REGISTRY:-sindhujacoretopia}/ontocode-graphdb:${VERSION:-latest}
    container_name: ontocode-graphdb
    restart: unless-stopped
    ports:
      - "7200:7200"
    environment:
      GDB_HEAP_SIZE: 2g
      GDB_LICENSE_PATH: /opt/graphdb
    volumes:
      - graphdb-data:/opt/graphdb/home/data
    networks:
      - ontology-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7200/rest/repositories"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s

  # GraphDB Repository Initializer - Creates 'ontocode' repository with inference DISABLED
  graphdb-init:
    image: curlimages/curl:latest
    container_name: ontocode-graphdb-init
    depends_on:
      graphdb:
        condition: service_healthy
    networks:
      - ontology-net
    restart: "no"
    command:
      - sh
      - -c
      - |
        echo "=== GraphDB Repository Init ==="
        for i in $$(seq 1 30); do
          curl -sf http://graphdb:7200/rest/repositories >/dev/null 2>&1 && break
          echo "Waiting for GraphDB... attempt $$i/30"
          sleep 5
        done
        
        if curl -s http://graphdb:7200/rest/repositories | grep -q "ontocode"; then
          echo "[OK] Repository ontocode already exists"
        else
          echo "Creating ontocode repository with inference DISABLED..."
          cat > /tmp/repo.ttl << 'EOFCONFIG'
        @prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .
        @prefix rep: <http://www.openrdf.org/config/repository#> .
        @prefix sr: <http://www.openrdf.org/config/repository/sail#> .
        @prefix sail: <http://www.openrdf.org/config/sail#> .
        @prefix graphdb: <http://www.ontotext.com/config/graphdb#> .
        [] a rep:Repository ;
            rep:repositoryID "ontocode" ;
            rdfs:label "OntoCode Repository - No Inference" ;
            rep:repositoryImpl [
                rep:repositoryType "graphdb:SailRepository" ;
                sr:sailImpl [
                    sail:sailType "graphdb:Sail" ;
                    graphdb:ruleset "empty" ;
                    graphdb:disable-sameAs "true" ;
                    graphdb:check-for-inconsistencies "false" ;
                    graphdb:in-memory-literal-properties "true" ;
                    graphdb:enable-literal-index "true" ;
                    graphdb:entity-index-size "10000000" ;
                    graphdb:enablePredicateList "true" ;
                    graphdb:read-only "false" ;
                ]
            ] .
        EOFCONFIG
          curl -v -X POST -H "Content-Type: multipart/form-data" -F "config=@/tmp/repo.ttl" http://graphdb:7200/rest/repositories
          echo "[OK] Repository created successfully"
        fi
        
        echo "Setting ontocode as active repository..."
        if curl -sf http://graphdb:7200/rest/repositories/ontocode/size >/dev/null 2>&1; then
          echo "[OK] Repository ontocode is ACTIVE and accessible"
          echo "[OK] Active Repository: ontocode"
          echo "[OK] Inference: DISABLED (ruleset: empty)"
        else
          echo "[ERROR] Repository not accessible"
        fi
        echo "=== Init Complete ==="

  # Keycloak Database
  keycloak-db:
    image: postgres:15-alpine
    container_name: ontocode-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    networks:
      - ontology-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Keycloak Identity Provider
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: ontocode-keycloak
    restart: unless-stopped
    command: start-dev --spi-theme-static-max-age=-1 --spi-theme-cache-themes=false --spi-theme-cache-templates=false --spi-security-headers-default-content-security-policy="frame-src *; frame-ancestors *; object-src 'none';"
    ports:
      - "9080:8080"
    environment:
      # Admin credentials
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Database configuration
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      # Hostname / proxy settings
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "9080"
      KC_HOSTNAME_URL: http://localhost:9080
      KC_HOSTNAME_ADMIN_URL: http://localhost:9080
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      # Theme caching (disabled for dev)
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
      KC_SPI_THEME_STATIC_MAX_AGE: "-1"
      # Health + management
      KC_HTTP_MANAGEMENT_PORT: "9000"
      KC_HEALTH_ENABLED: "true"
      # Allow embedding in VS Code webview / cross-origin iframes
      KC_SPI_SECURITY_HEADERS_DEFAULT_X_FRAME_OPTIONS: ""
      KC_SPI_SECURITY_HEADERS_DEFAULT_CONTENT_SECURITY_POLICY: "frame-src *; frame-ancestors *; object-src 'none';"
    volumes:
      - ./keycloak-themes:/opt/keycloak/themes
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - ontology-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Authentication Service
  auth:
    image: ${DOCKER_REGISTRY:-sindhujacoretopia}/ontocode-auth:${VERSION:-latest}
    container_name: ontocode-auth
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme123}@mongo:27017/${MONGODB_DATABASE:-ontocode}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-b250b2NvZGUtc3VwZXItc2VjcmV0LWp3dC1rZXktMjAyNC1taW5pbXVtLTI1Ni1iaXRzLXJlcXVpcmVkIQ==}
      SPRING_PROFILES_ACTIVE: dev
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
      # OIDC Configuration
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_BASE_URL: ${OIDC_BASE_URL:-http://localhost:8086}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-ontocode-auth}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://keycloak:8080/realms/ontocode}
      OIDC_ALLOWED_REDIRECT_ORIGINS: ${OIDC_ALLOWED_REDIRECT_ORIGINS:-http://localhost:3001,http://localhost:80}
    depends_on:
      mongo:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - ontology-net

  # API Gateway
  gateway:
    image: ${DOCKER_REGISTRY:-sindhujacoretopia}/ontocode-gateway:${VERSION:-latest}
    container_name: ontocode-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-b250b2NvZGUtc3VwZXItc2VjcmV0LWp3dC1rZXktMjAyNC1taW5pbXVtLTI1Ni1iaXRzLXJlcXVpcmVkIQ==}
      AUTH_SERVICE_URL: http://auth:8086
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
    depends_on:
      auth:
        condition: service_started
    networks:
      - ontology-net

  # Ontology Editor Service
  owl-editor:
    image: ${DOCKER_REGISTRY:-sindhujacoretopia}/ontocode-editor:${VERSION:-latest}
    container_name: ontocode-editor
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme123}@mongo:27017/${MONGODB_DATABASE:-ontocode}?authSource=admin
      GRAPHDB_URL: http://graphdb:7200
      GRAPHDB_REPOSITORY: ${GRAPHDB_REPOSITORY:-ontocode}
      SPRING_PROFILES_ACTIVE: dev
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      JIRA_ENABLED: ${JIRA_ENABLED:-true}
      JIRA_CLOUD_URL: ${JIRA_CLOUD_URL:-https://coretopia.atlassian.net}
      JIRA_USER_EMAIL: ${JIRA_USER_EMAIL:-uma@coretopia.com}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-ATATT3xFfGF0fhZLilL7hxxMAXQcjCEQXmkcVVMIk50av6aSqaDwoY6HOqhuriEGAL7uSwL3oFh6p4n9Vssrq6u67kAKi6nxUAICruIUtJDTKyUhM0ibNyq-S3DJVM88v-VkOX5jYc-yCCjIH7hQ9NYNWbQQLnPJngbbCLGOuzii6WkIL9s4G7g=6CEB1011}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-TSRI}
      JIRA_EPIC_KEY: ${JIRA_EPIC_KEY:-TSRI-103}
      JIRA_ISSUE_TYPE: ${JIRA_ISSUE_TYPE:-Task}
    depends_on:
      - mongo
      - graphdb
    networks:
      - ontology-net

  # SWRL Rules Service
  swrl-service:
    image: ${DOCKER_REGISTRY:-sindhujacoretopia}/ontocode-swrl:${VERSION:-latest}
    container_name: ontocode-swrl
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme123}@mongo:27017/${MONGODB_DATABASE:-ontocode}?authSource=admin
      GRAPHDB_URL: http://graphdb:7200
      GRAPHDB_REPOSITORY: ${GRAPHDB_REPOSITORY:-ontocode}
      ONTOLOGY_EDITOR_URL: http://owl-editor:8083
      SPRING_PROFILES_ACTIVE: dev
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
    depends_on:
      - mongo
      - graphdb
    networks:
      - ontology-net

  # Plugin Service
  plugin-service:
    image: ${DOCKER_REGISTRY:-sindhujacoretopia}/ontocode-plugin:${VERSION:-latest}
    container_name: ontocode-plugin
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme123}@mongo:27017/${MONGODB_DATABASE:-ontocode}?authSource=admin
      SPRING_DATA_MONGODB_DATABASE: ${MONGODB_DATABASE:-ontocode}
      JWT_SECRET: ${JWT_SECRET:-b250b2NvZGUtc3VwZXItc2VjcmV0LWp3dC1rZXktMjAyNC1taW5pbXVtLTI1Ni1iaXRzLXJlcXVpcmVkIQ==}
      SPRING_PROFILES_ACTIVE: dev
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
    depends_on:
      - mongo
    networks:
      - ontology-net

  # Plugin Initialization Service
  plugin-init:
    image: ${DOCKER_REGISTRY:-sindhujacoretopia}/ontocode-plugin-init:${VERSION:-latest}
    container_name: ontocode-plugin-init
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme123}@mongo:27017/${MONGODB_DATABASE:-ontocode}?authSource=admin
      MONGODB_DATABASE: ${MONGODB_DATABASE:-ontocode}
    depends_on:
      mongo:
        condition: service_healthy
      plugin-service:
        condition: service_started
    networks:
      - ontology-net

  # VS Code Web Extension (Self-Contained) - DISABLED
  # vscode-web:
  #   image: ${DOCKER_REGISTRY:-sindhujacoretopia}/ontocode-vscode-web:${VERSION:-latest}
  #   container_name: ontocode-vscode-web
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     # Mount local workspace for file editing
  #     - ${WORKSPACE_PATH:-./data/projects}:/workspace/projects
  #   environment:
  #     VSCODE_WEB_HOST: 0.0.0.0
  #     VSCODE_WEB_PORT: 3000
  #     # OntoCode API endpoints
  #     ONTOCODE_API_URL: http://gateway:80
  #     AUTH_SERVICE_URL: http://auth:8086
  #   depends_on:
  #     - gateway
  #     - auth
  #   networks:
  #     - ontology-net
  #   healthcheck:
  #     test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
  #     interval: 15s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 40s

  # Web Application (React Frontend)
  webapp:
    image: ${DOCKER_REGISTRY:-sindhujacoretopia}/ontocode-web:${VERSION:-latest}
    container_name: ontocode-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      ONTOCODE_API_URL: http://gateway:80
    depends_on:
      - gateway
      - auth
    networks:
      - ontology-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  mongo-data:
  graphdb-data:
  keycloak-postgres-data:

networks:
  ontology-net:
    driver: bridge