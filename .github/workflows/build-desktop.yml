name: Build & Upload Desktop Installers

on:
  workflow_dispatch:          # manual trigger from GitHub Actions UI
  push:
    tags:
      - 'desktop-v*'          # trigger on tags like desktop-v1.0.0

jobs:
  # ── macOS (ARM64 + Intel) ───────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd electron-app
          npm install

      - name: Build macOS DMG (ARM64 + Intel)
        run: |
          cd electron-app
          npx electron-builder --mac --arm64 --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # skip code signing for now

      - name: List built files
        run: ls -lh electron-app/dist-electron/*.dmg

      - name: Upload mac-arm64 to GridFS
        run: |
          TOKEN=$(curl -s -X POST ${{ secrets.API_BASE_URL }}/api/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${{ secrets.ADMIN_EMAIL }}\",\"password\":\"${{ secrets.ADMIN_PASSWORD }}\"}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['jwt'])")

          curl -X POST ${{ secrets.API_BASE_URL }}/api/downloads/upload \
            -H "Authorization: Bearer $TOKEN" \
            -F "platform=mac-arm64" \
            -F "filename=OntoCode-1.0.0-arm64.dmg" \
            -F "file=@electron-app/dist-electron/OntoCode-1.0.0-arm64.dmg"

      - name: Upload mac-x64 to GridFS
        run: |
          TOKEN=$(curl -s -X POST ${{ secrets.API_BASE_URL }}/api/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${{ secrets.ADMIN_EMAIL }}\",\"password\":\"${{ secrets.ADMIN_PASSWORD }}\"}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['jwt'])")

          curl -X POST ${{ secrets.API_BASE_URL }}/api/downloads/upload \
            -H "Authorization: Bearer $TOKEN" \
            -F "platform=mac-x64" \
            -F "filename=OntoCode-1.0.0-x64.dmg" \
            -F "file=@electron-app/dist-electron/OntoCode-1.0.0-x64.dmg"

  # ── Linux (AppImage + deb) ──────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd electron-app
          npm install

      - name: Build Linux AppImage
        run: |
          cd electron-app
          npx electron-builder --linux --x64

      - name: List built files
        run: ls -lh electron-app/dist-electron/*.AppImage electron-app/dist-electron/*.deb 2>/dev/null || true

      - name: Upload linux-x64 AppImage to GridFS
        run: |
          TOKEN=$(curl -s -X POST ${{ secrets.API_BASE_URL }}/api/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${{ secrets.ADMIN_EMAIL }}\",\"password\":\"${{ secrets.ADMIN_PASSWORD }}\"}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['jwt'])")

          curl -X POST ${{ secrets.API_BASE_URL }}/api/downloads/upload \
            -H "Authorization: Bearer $TOKEN" \
            -F "platform=linux-x64" \
            -F "filename=OntoCode-1.0.0-x86_64.AppImage" \
            -F "file=@electron-app/dist-electron/OntoCode-1.0.0-x86_64.AppImage"

      - name: Upload linux-deb to GridFS
        run: |
          TOKEN=$(curl -s -X POST ${{ secrets.API_BASE_URL }}/api/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${{ secrets.ADMIN_EMAIL }}\",\"password\":\"${{ secrets.ADMIN_PASSWORD }}\"}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['jwt'])")

          DEB=$(ls electron-app/dist-electron/*.deb 2>/dev/null | head -1)
          if [ -n "$DEB" ]; then
            curl -X POST ${{ secrets.API_BASE_URL }}/api/downloads/upload \
              -H "Authorization: Bearer $TOKEN" \
              -F "platform=linux-deb" \
              -F "filename=ontocode_1.0.0_amd64.deb" \
              -F "file=@$DEB"
          fi
