name: Build macOS desktop (manual)
on:
  workflow_dispatch:
    inputs:
      arch:
        description: Which chip to build
        type: choice
        options: [arm64, x64, both]
        default: arm64
      notarize:
        description: Send the app to Apple for notarization (slower, run after signing works)
        type: boolean
        default: false
      target:
        description: What to build (mas-dev is a sandboxed test app for the Mac App Store feasibility check)
        type: choice
        options: [dmg, mas-dev]
        default: dmg
concurrency:
  group: macos-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.arch == 'arm64' && '[{"arch":"arm64","runner":"macos-15","mongo":"macos-arm64"}]' || inputs.arch == 'x64' && '[{"arch":"x64","runner":"macos-15-intel","mongo":"macos-x86_64"}]' || '[{"arch":"arm64","runner":"macos-15","mongo":"macos-arm64"},{"arch":"x64","runner":"macos-15-intel","mongo":"macos-x86_64"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      ONTOCODE_UPDATE_HOST: ontocodeapi.selfresearch.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: j21
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-java@v4
        id: j17
        with: { distribution: temurin, java-version: "17" }
      - run: |
          echo "JAVA_HOME_21=${{ steps.j21.outputs.path }}" >> "$GITHUB_ENV"
          echo "JAVA_HOME_17=${{ steps.j17.outputs.path }}" >> "$GITHUB_ENV"
          echo "JAVA17_HOME=${{ steps.j17.outputs.path }}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            electron-app/package-lock.json
            ontology-vscode-extension/package-lock.json
            ontology-vscode-extension/webview-src/package-lock.json
            plugins/*/package-lock.json
      - name: Cache MongoDB 6.0.29
        id: mongo
        uses: actions/cache@v4
        with:
          path: data/mongodb/bin/darwin
          key: mongod-6.0.29-${{ matrix.arch }}
      - if: steps.mongo.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/mongodb/bin/darwin /tmp/mongo
          curl -fsSL "https://fastdl.mongodb.org/osx/mongodb-${{ matrix.mongo }}-6.0.29.tgz" | tar -xz -C /tmp/mongo --strip-components=1
          cp /tmp/mongo/bin/mongod data/mongodb/bin/darwin/mongod
          chmod +x data/mongodb/bin/darwin/mongod
      - name: Build backend jars
        run: |
          JAVA_HOME="${{ steps.j17.outputs.path }}" mvn -q -N install -DskipTests
          JAVA_HOME="${{ steps.j17.outputs.path }}" mvn -q clean install -pl shared/common-models,shared/common-utils -DskipTests -Djava.version=17 -Dmaven.compiler.source=17 -Dmaven.compiler.target=17 -Dmaven.compiler.release=17
          JAVA_HOME="${{ steps.j17.outputs.path }}" mvn -q clean package -pl ontology-swrl -DskipTests
          JAVA_HOME="${{ steps.j21.outputs.path }}" mvn -q -pl ontology-editor,ontology-auth,ontology-plugin-service -am clean install -DskipTests -Dgit.commit="$GITHUB_SHA"
          (cd ontology-desktop && JAVA_HOME="${{ steps.j21.outputs.path }}" mvn -q clean package -DskipTests -Dgit.commit="$GITHUB_SHA")
      - name: Install web dependencies
        run: |
          for d in electron-app ontology-vscode-extension ontology-vscode-extension/webview-src plugins/*; do
            (cd "$d" && npm ci)
          done
      - name: Build the dmg
        working-directory: electron-app
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARIZE: ${{ inputs.notarize }}
          TARGET: ${{ inputs.target }}
          MAS_CSC_LINK: ${{ secrets.MAS_CSC_LINK }}
          MAS_CSC_KEY_PASSWORD: ${{ secrets.MAS_CSC_KEY_PASSWORD }}
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
        run: |
          set -eo pipefail
          script=dist:mac
          if [ "$TARGET" = "mas-dev" ]; then
            if [ -z "$MAS_CSC_LINK" ] || [ -z "$MAS_CSC_KEY_PASSWORD" ] || [ -z "$MAS_PROVISIONING_PROFILE" ]; then
              echo "Add the MAS_CSC_LINK, MAS_CSC_KEY_PASSWORD and MAS_PROVISIONING_PROFILE secrets before building the sandbox test app"
              exit 1
            fi
            echo "Building the sandboxed Mac App Store test app"
            echo "$MAS_PROVISIONING_PROFILE" | base64 --decode > build-assets/embedded.provisionprofile
            export CSC_LINK="$MAS_CSC_LINK" CSC_KEY_PASSWORD="$MAS_CSC_KEY_PASSWORD"
            script=dist:mac:mas-dev
            args=""
          elif [ -n "$CSC_LINK" ]; then
            echo "Signing with the Developer ID certificate"
            args="-c.mac.hardenedRuntime=true -c.mac.entitlements=build-assets/entitlements.mac.plist -c.mac.entitlementsInherit=build-assets/entitlements.mac.plist -c.mac.gatekeeperAssess=false"
            if [ "$NOTARIZE" = "true" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              echo "Notarizing"
              args="$args -c.mac.notarize=true"
            else
              echo "Skipping notarization (switch off or Apple ID secrets not set)"
            fi
          else
            echo "No certificate secret, signing ad-hoc"
            unset CSC_LINK CSC_KEY_PASSWORD
            args="-c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.gatekeeperAssess=false"
          fi
          for attempt in 1 2 3; do
            if npm run $script -- --${{ matrix.arch }} --publish never $args 2>&1 | tee dist-build.log; then
              break
            fi
            if [ "$attempt" = 3 ] || ! grep -q -E "Failed to staple|network connection was lost" dist-build.log; then
              exit 1
            fi
            echo "Apple could not be reached while stapling, trying again (attempt $((attempt + 1)) of 3)"
          done
      - name: Check the app is signed
        if: inputs.target != 'mas-dev'
        working-directory: electron-app
        run: |
          set -e
          dmg=$(ls dist-electron/*.dmg | head -1)
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -mountpoint "$mnt" -nobrowse -readonly
          app=$(ls -d "$mnt"/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E "Signature|Authority|TeamIdentifier|Identifier"
          xcrun stapler validate "$app" || echo "Not notarized"
          hdiutil detach "$mnt"
      - name: Pack the sandboxed test app
        if: inputs.target == 'mas-dev'
        working-directory: electron-app
        run: |
          set -eo pipefail
          app=$(ls -d dist-electron/mas-dev*/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements - "$app" 2>&1 | head -30
          ditto -c -k --keepParent "$app" "dist-electron/OntoCode-Studio-mas-dev-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        if: inputs.target == 'mas-dev'
        with:
          name: ontocode-macos-sandbox-test-${{ matrix.arch }}
          path: electron-app/dist-electron/OntoCode-Studio-mas-dev-*.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: inputs.target != 'mas-dev'
        with:
          name: ontocode-macos-${{ matrix.arch }}
          path: electron-app/dist-electron/*.dmg
          if-no-files-found: error
          retention-days: 14
