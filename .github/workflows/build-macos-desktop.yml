name: Build macOS desktop (manual)
on:
  workflow_dispatch:
    inputs:
      arch:
        description: Which chip to build
        type: choice
        options: [arm64, x64, both]
        default: arm64
concurrency:
  group: macos-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.arch == 'arm64' && '[{"arch":"arm64","runner":"macos-15","mongo":"macos-arm64"}]' || inputs.arch == 'x64' && '[{"arch":"x64","runner":"macos-15-intel","mongo":"macos-x86_64"}]' || '[{"arch":"arm64","runner":"macos-15","mongo":"macos-arm64"},{"arch":"x64","runner":"macos-15-intel","mongo":"macos-x86_64"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ONTOCODE_UPDATE_HOST: ontocodeapi.selfresearch.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: j21
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-java@v4
        id: j17
        with: { distribution: temurin, java-version: "17" }
      - run: |
          echo "JAVA_HOME_21=${{ steps.j21.outputs.path }}" >> "$GITHUB_ENV"
          echo "JAVA_HOME_17=${{ steps.j17.outputs.path }}" >> "$GITHUB_ENV"
          echo "JAVA17_HOME=${{ steps.j17.outputs.path }}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            electron-app/package-lock.json
            ontology-vscode-extension/package-lock.json
            ontology-vscode-extension/webview-src/package-lock.json
            plugins/*/package-lock.json
      - name: Cache MongoDB 6.0.29
        id: mongo
        uses: actions/cache@v4
        with:
          path: data/mongodb/bin/darwin
          key: mongod-6.0.29-${{ matrix.arch }}
      - if: steps.mongo.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/mongodb/bin/darwin /tmp/mongo
          curl -fsSL "https://fastdl.mongodb.org/osx/mongodb-${{ matrix.mongo }}-6.0.29.tgz" | tar -xz -C /tmp/mongo --strip-components=1
          cp /tmp/mongo/bin/mongod data/mongodb/bin/darwin/mongod
          chmod +x data/mongodb/bin/darwin/mongod
      - name: Build backend jars
        run: |
          JAVA_HOME="${{ steps.j17.outputs.path }}" mvn -q -pl ontology-swrl -am package -DskipTests
          JAVA_HOME="${{ steps.j21.outputs.path }}" mvn -q -pl ontology-editor,ontology-auth,ontology-plugin-service -am clean install -DskipTests -Dgit.commit="$GITHUB_SHA"
          (cd ontology-desktop && JAVA_HOME="${{ steps.j21.outputs.path }}" mvn -q clean package -DskipTests -Dgit.commit="$GITHUB_SHA")
      - name: Install web dependencies
        run: |
          for d in electron-app ontology-vscode-extension ontology-vscode-extension/webview-src plugins/*; do
            (cd "$d" && npm ci)
          done
      - name: Build the dmg
        working-directory: electron-app
        run: npm run dist:mac -- --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ontocode-macos-${{ matrix.arch }}
          path: electron-app/dist-electron/*.dmg
          if-no-files-found: error
          retention-days: 14
