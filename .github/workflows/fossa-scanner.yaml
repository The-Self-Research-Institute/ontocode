name: FOSSA Scanner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fossa-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run FOSSA analyze
        uses: fossas/fossa-action@v1
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}

      - name: Fail on license policy violations
        uses: fossas/fossa-action@v1
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
          run-tests: true

  fossa-container-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['postgres:17']
    steps:
      - uses: actions/checkout@v4

      - name: Scan container image ${{ matrix.image }}
        uses: fossas/fossa-action@v1
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
          container: ${{ matrix.image }}

      - name: Fail on license policy violations for ${{ matrix.image }}
        uses: fossas/fossa-action@v1
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
          container: ${{ matrix.image }}
          run-tests: true
