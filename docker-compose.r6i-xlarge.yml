# Memory sizing override — r6i.xlarge (32 GB RAM, 4 vCPU consistent)
# Same heap layout as t3.2xlarge (32 GB) but intended for r6i (no CPU burst throttle).
# Total container limits ≈ 21 GB | leaves ~11 GB for OS + Docker overhead
#
# Usage:
#   docker compose -f docker-compose.production.yml -f docker-compose.r6i-xlarge.yml up -d

services:
  mongo:
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5", "--auth"]
    deploy:
      resources:
        limits:
          memory: 1g

  fuseki:
    environment:
      JVM_ARGS: "-Xmx7g -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    deploy:
      resources:
        limits:
          memory: 8g

  auth:
    environment:
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx640m -XX:+UseG1GC
    deploy:
      resources:
        limits:
          memory: 768m

  gateway:
    environment:
      JAVA_OPTS: -Xms128m -Xmx640m -XX:+UseG1GC
    deploy:
      resources:
        limits:
          memory: 1g

  owl-editor:
    environment:
      JAVA_OPTS: "-Xms2g -Xmx4g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/heap-dump.hprof -Xlog:gc*:file=/app/logs/gc.log:time,uptime,level,tags:filecount=3,filesize=20m -DentityExpansionLimit=100000000 -Djdk.xml.entityExpansionLimit=100000000"
      ONTOCODE_IMPORT_MAX_CONCURRENT: 1
      ONTOCODE_DLQUERY_MAX_CONCURRENT: 2
      ONTOCODE_DLQUERY_SLOT_BUDGET: 2
      ONTOCODE_REASONER_WORKER_ENABLED: "true"
      ONTOCODE_REASONER_MAX_TRIPLES: 20000000
    deploy:
      resources:
        limits:
          memory: 5g

  reasoner-worker:
    environment:
      JAVA_OPTS: "-Xms3g -Xmx10g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/heap-dump.hprof"
      ONTOCODE_REASONING_MAX_CONCURRENT: 2
      ONTOCODE_REASONING_SLOT_BUDGET: 2
      ONTOCODE_REASONER_MAX_TRIPLES: 20000000
      ONTOCODE_REASONER_ELK_MAX_TRIPLES: 20000000
    deploy:
      resources:
        limits:
          memory: 11g

  swrl-service:
    environment:
      JAVA_OPTS: "-Xms256m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/heap-dump.hprof -Xlog:gc*:file=/app/logs/gc.log:time,uptime,level,tags:filecount=2,filesize=10m"
    deploy:
      resources:
        limits:
          memory: 1536m

  plugin-service:
    environment:
      JAVA_OPTS: -Xms256m -Xmx1g -XX:+UseG1GC
    deploy:
      resources:
        limits:
          memory: 1.5g

  webapp:
    deploy:
      resources:
        limits:
          memory: 256m
