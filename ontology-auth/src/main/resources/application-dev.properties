# Local development profile — activate with:
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
# Or set SPRING_PROFILES_ACTIVE=dev
#
# Override jwt.secret in production via JWT_SECRET (openssl rand -base64 48).

# Base64-encoded secret (decodes to 48 bytes). LOCAL DEV ONLY.
jwt.secret=${JWT_SECRET:ZGV2ZWxvcG1lbnQtb250b2NvZGUtand0LXNlY3JldC1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQ=}

# Docker Mongo (hybrid dev: ontocode-mongo on localhost:27017 or :27018 if Windows mongod blocks 27017)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://admin:changeme123@localhost:27018/ontocode?authSource=admin}

# Fast health checks — avoid actuator hanging when Mongo is slow or misconfigured
management.health.mongo.enabled=false

# Disable rate limit noise during local Playwright runs
security.rate-limit.enabled=false
# Disable email verification for local dev (Playwright tests can register users without email)
app.email.enabled=false

# Optional: disable strict mail requirement when SMTP not configured
spring.mail.password=${SMTP_PASSWORD:}

# Stripe — dummy values for local dev (billing features won't work, ontology features will)
stripe.api.secret-key=${STRIPE_SECRET_KEY:sk_test_local_dev_placeholder}
stripe.api.publishable-key=${STRIPE_PUBLISHABLE_KEY:pk_test_local_dev_placeholder}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_local_dev_placeholder}
stripe.price.pro-monthly=${STRIPE_PRICE_PRO_MONTHLY:price_local_dev_pro_monthly}
stripe.price.pro-yearly=${STRIPE_PRICE_PRO_YEARLY:price_local_dev_pro_yearly}
stripe.price.enterprise-monthly=${STRIPE_PRICE_ENTERPRISE_MONTHLY:price_local_dev_ent_monthly}
stripe.price.enterprise-yearly=${STRIPE_PRICE_ENTERPRISE_YEARLY:price_local_dev_ent_yearly}
app.base-url=${APP_BASE_URL:http://localhost:8080}
