# OntoCode Authentication Service Configuration

spring.application.name=ontology-auth
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ontocode}
spring.data.mongodb.auto-index-creation=true

# Server Port - MUST be in properties format, not YAML
server.port=8086

# Application Configuration
 # app.base-url should point to the FRONTEND webapp URL, not the backend API
# This URL is used in invitation emails and reset password links
app.base-url=${BASE_URL:https://ontocode.selfresearch.org}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.email=${ADMIN_EMAIL:admin@example.com}
app.email.from=${EMAIL_FROM:noreply@ontocode.com}

# SMTP Email Configuration (Gmail example)
# For Gmail: Use App Password, not regular password
# Enable 2FA and generate App Password at: https://myaccount.google.com/apppasswords
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:noreply@example.com}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Alternative SMTP providers:
# Outlook: smtp.office365.com:587
# Yahoo: smtp.mail.yahoo.com:587
# SendGrid: smtp.sendgrid.net:587
# AWS SES: email-smtp.us-east-1.amazonaws.com:587

# JWT Configuration
jwt.secret=${JWT_SECRET}
# 86400000 ms = 24 hours. Use a refresh-token flow for longer sessions.
jwt.expiration=86400000

# Security Configuration
security.rate-limit.enabled=true
security.rate-limit.requests-per-minute=5
security.lockout.enabled=true
security.lockout.max-attempts=5
security.lockout.duration-minutes=15
security.tokens.verification-hours=24
security.tokens.password-reset-hours=1

# Logging
logging.level.root=INFO
logging.level.self.research.ontology.auth=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/auth-service.log

# Management Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ─────────────────────────────────────────────────────────────────────────────
# Stripe Payment Configuration
# Set all keys via environment variables — NEVER hardcode values here.
# ─────────────────────────────────────────────────────────────────────────────
# Stripe secret key (sk_live_... for production, sk_test_... for test)
stripe.api.secret-key=${STRIPE_SECRET_KEY:}
stripe.api.publishable-key=${STRIPE_PUBLISHABLE_KEY:}

# Webhook signing secret — obtained from Stripe Dashboard > Webhooks
# Used to verify that webhook events are genuinely from Stripe.
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}

# Stripe Price IDs — create these in Stripe Dashboard > Products
stripe.price.pro-monthly=${STRIPE_PRICE_PRO_MONTHLY:}
stripe.price.pro-yearly=${STRIPE_PRICE_PRO_YEARLY:}
stripe.price.enterprise-monthly=${STRIPE_PRICE_ENTERPRISE_MONTHLY:}
stripe.price.enterprise-yearly=${STRIPE_PRICE_ENTERPRISE_YEARLY:}


# ─────────────────────────────────────────────────────────────────────────────
# Billing reminder emails
# ─────────────────────────────────────────────────────────────────────────────
# Enable/disable all billing reminder emails (trial ending + renewal)
billing.reminder.enabled=${BILLING_REMINDER_ENABLED:true}
# How many days before expiry to send the reminder (default: 3)
billing.reminder.days-before=${BILLING_REMINDER_DAYS_BEFORE:3}
# Cron: when to run the reminder job (default: daily at 9 AM server time)
billing.reminder.cron=${BILLING_REMINDER_CRON:0 0 9 * * *}

# ─────────────────────────────────────────────────────────────────────────────
# Subscription expiry check & auto-renewal
# ─────────────────────────────────────────────────────────────────────────────
# Enable/disable the periodic expiry check
billing.expiry-check.enabled=${BILLING_EXPIRY_CHECK_ENABLED:true}
# How often to run expiry check in milliseconds (default: 6 hours = 21600000)
billing.expiry-check.interval-ms=${BILLING_EXPIRY_CHECK_INTERVAL_MS:21600000}
# Enable/disable auto-renewal job
billing.autorenewal.enabled=${BILLING_AUTORENEWAL_ENABLED:true}
# Cron: when to run auto-renewal (default: daily at 2 AM server time)
billing.autorenewal.cron=${BILLING_AUTORENEWAL_CRON:0 0 2 * * ?}

# Storage limits per plan (GB) — override via env vars STORAGE_LIMIT_FREE_GB / STORAGE_LIMIT_PRO_GB
storage.limit.free.gb=${STORAGE_LIMIT_FREE_GB:10}
storage.limit.pro.gb=${STORAGE_LIMIT_PRO_GB:100}

# Multipart file upload configuration — streams large files to disk
server.tomcat.max-http-post-size=-1
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
spring.servlet.multipart.file-size-threshold=10MB

# Async request timeout for StreamingResponseBody (30 minutes for large file downloads)
spring.mvc.async.request-timeout=1800000
