# OntoCode Authentication Service Configuration

spring.application.name=ontology-auth
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ontocode}
spring.data.mongodb.auto-index-creation=true

# Server Port - MUST be in properties format, not YAML
server.port=8086

# Application Configuration
 # app.base-url should point to the FRONTEND webapp URL, not the backend API
# This URL is used in invitation emails and reset password links
app.base-url=${BASE_URL:https://ontocode.selfresearch.org}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.email=${ADMIN_EMAIL:admin@example.com}
app.email.from=${EMAIL_FROM:noreply@ontocode.com}

# SMTP Email Configuration (Gmail example)
# For Gmail: Use App Password, not regular password
# Enable 2FA and generate App Password at: https://myaccount.google.com/apppasswords
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:sindhuja@coretopia.com}
spring.mail.password=${SMTP_PASSWORD:oejs ytns tcog koim}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Alternative SMTP providers:
# Outlook: smtp.office365.com:587
# Yahoo: smtp.mail.yahoo.com:587
# SendGrid: smtp.sendgrid.net:587
# AWS SES: email-smtp.us-east-1.amazonaws.com:587

# JWT Configuration
jwt.secret=${JWT_SECRET:b250b2NvZGUtc3VwZXItc2VjcmV0LWp3dC1rZXktMjAyNC1taW5pbXVtLTI1Ni1iaXRzLXJlcXVpcmVkIQ==}
jwt.expiration=31536000000

# Security Configuration
security.rate-limit.enabled=true
security.rate-limit.requests-per-minute=5
security.lockout.enabled=true
security.lockout.max-attempts=5
security.lockout.duration-minutes=15
security.tokens.verification-hours=24
security.tokens.password-reset-hours=1

# Logging
logging.level.root=INFO
logging.level.self.research.ontology.auth=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/auth-service.log

# Management Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Multipart file upload configuration — streams large files to disk
server.tomcat.max-http-post-size=-1
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
spring.servlet.multipart.file-size-threshold=10MB
