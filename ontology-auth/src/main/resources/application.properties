# OntoCode Authentication Service Configuration

spring:
  application:
    name: ontology-auth
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ontocode}
      auto-index-creation: true

server:
  port: 8086

# Application Configuration
app:
  # Base URL for email links (MUST be set in production)
  base-url: ${BASE_URL:http://localhost:8082}
  
  # Admin credentials (MUST be set via environment variables in production)
  admin:
    password: ${ADMIN_PASSWORD:}  # Leave empty - must be set via env var
    email: ${ADMIN_EMAIL:admin@example.com}
  
  # Email configuration
  email:
    from: ${EMAIL_FROM:noreply@ontocode.com}

# Mailtrap Configuration
mailtrap:
  api:
    token: ${MAILTRAP_API_TOKEN}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-secret-key-change-in-production}
  expiration: 86400000  # 24 hours in milliseconds

# Security Configuration
security:
  # Rate limiting
  rate-limit:
    enabled: true
    requests-per-minute: 5
  
  # Account lockout
  lockout:
    enabled: true
    max-attempts: 5
    duration-minutes: 15
  
  # Token expiration
  tokens:
    verification-hours: 24
    password-reset-hours: 1

# Logging
logging:
  level:
    root: INFO
    self.research.ontology.auth: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  file:
    name: logs/auth-service.log

# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized