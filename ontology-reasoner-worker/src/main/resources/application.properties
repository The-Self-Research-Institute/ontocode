spring.application.name=reasoner-worker
server.port=8088

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState,runawayReasoning

ontocode.editor.url=${ONTOLOGY_EDITOR_URL:http://owl-editor:8083}
ontocode.internal.token=${ONTOCODE_INTERNAL_TOKEN:ontocode-internal}
ontocode.editor.quick-connect-timeout-ms=${ONTOCODE_EDITOR_QUICK_CONNECT_TIMEOUT_MS:2000}
ontocode.editor.quick-read-timeout-ms=${ONTOCODE_EDITOR_QUICK_READ_TIMEOUT_MS:5000}

ontocode.reasoning.max-concurrent=${ONTOCODE_REASONING_MAX_CONCURRENT:2}
ontocode.reasoning.slot-budget=${ONTOCODE_REASONING_SLOT_BUDGET:2}
ontocode.reasoning.fast-lane-max-concurrent=${ONTOCODE_REASONING_FAST_LANE_MAX_CONCURRENT:3}
ontocode.reasoning.heavy-lane-max-concurrent=${ONTOCODE_REASONING_HEAVY_LANE_MAX_CONCURRENT:1}
ontocode.reasoning.memory-aware=${ONTOCODE_REASONING_MEMORY_AWARE:true}
ontocode.reasoning.min-free-heap-ratio=${ONTOCODE_REASONING_MIN_FREE_HEAP_RATIO:0.20}
ontocode.reasoning.large-triple-threshold=${ONTOCODE_REASONING_LARGE_TRIPLE_THRESHOLD:500000}
ontocode.reasoning.yield-to-imports=${ONTOCODE_REASONING_YIELD_TO_IMPORTS:true}
ontocode.reasoning.retry-delay-ms=${ONTOCODE_REASONING_RETRY_DELAY_MS:15000}
ontocode.reasoning.max-queued-per-project=${ONTOCODE_REASONING_MAX_QUEUED_PER_PROJECT:5}
# Was 1800000 (30 min) — the frontend only polls for 10 min before giving up, so a stuck
# job kept its heap and lane slot allocated for 3x longer than anyone was still watching.
# 720000 (12 min) leaves a small buffer past the frontend's own timeout, then this actually
# cancels the task (future.cancel(true) + shutdownNow() in ReasoningQueueProcessor) so the
# resources get released promptly instead of held for the old, much longer ceiling.
ontocode.reasoning.job-timeout-ms=${ONTOCODE_REASONING_JOB_TIMEOUT_MS:720000}
ontocode.reasoning.idle-eviction-minutes=${ONTOCODE_REASONING_IDLE_EVICTION_MINUTES:15}
ontocode.reasoning.memory-janitor-interval-ms=${ONTOCODE_REASONING_MEMORY_JANITOR_INTERVAL_MS:60000}
ontocode.reasoning.suggest-gc-on-pressure=${ONTOCODE_REASONING_SUGGEST_GC_ON_PRESSURE:true}
ontocode.reasoning.heap-comfort-used-ratio=${ONTOCODE_REASONING_HEAP_COMFORT_USED_RATIO:0.40}
ontocode.reasoning.heap-pressure-used-ratio=${ONTOCODE_REASONING_HEAP_PRESSURE_USED_RATIO:0.70}
ontocode.reasoning.max-retained-results=${ONTOCODE_REASONING_MAX_RETAINED_RESULTS:8}
ontocode.reasoner.max-triples=${ONTOCODE_REASONER_MAX_TRIPLES:5000000}
ontocode.reasoning.snapshot-cache.max-entries=${ONTOCODE_REASONING_SNAPSHOT_CACHE_MAX_ENTRIES:6}
ontocode.reasoning.snapshot-cache.ttl-minutes=${ONTOCODE_REASONING_SNAPSHOT_CACHE_TTL_MINUTES:120}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://admin:changeme123@mongo:27017/ontocode?authSource=admin}
spring.data.mongodb.auto-index-creation=false
ontocode.reasoning.job-record-max-result-bytes=${ONTOCODE_REASONING_JOB_RECORD_MAX_RESULT_BYTES:1000000}
ontocode.reasoning.job-record-retention-hours=${ONTOCODE_REASONING_JOB_RECORD_RETENTION_HOURS:72}

logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
