spring.application.name=reasoner-worker
server.port=8088

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

ontocode.editor.url=${ONTOLOGY_EDITOR_URL:http://owl-editor:8083}
ontocode.internal.token=${ONTOCODE_INTERNAL_TOKEN:ontocode-internal}

ontocode.reasoning.max-concurrent=${ONTOCODE_REASONING_MAX_CONCURRENT:2}
ontocode.reasoning.slot-budget=${ONTOCODE_REASONING_SLOT_BUDGET:2}
ontocode.reasoning.memory-aware=${ONTOCODE_REASONING_MEMORY_AWARE:true}
ontocode.reasoning.min-free-heap-ratio=${ONTOCODE_REASONING_MIN_FREE_HEAP_RATIO:0.20}
ontocode.reasoning.large-triple-threshold=${ONTOCODE_REASONING_LARGE_TRIPLE_THRESHOLD:500000}
ontocode.reasoning.yield-to-imports=${ONTOCODE_REASONING_YIELD_TO_IMPORTS:true}
ontocode.reasoning.retry-delay-ms=${ONTOCODE_REASONING_RETRY_DELAY_MS:15000}
ontocode.reasoning.idle-eviction-minutes=${ONTOCODE_REASONING_IDLE_EVICTION_MINUTES:15}
ontocode.reasoning.memory-janitor-interval-ms=${ONTOCODE_REASONING_MEMORY_JANITOR_INTERVAL_MS:60000}
ontocode.reasoning.suggest-gc-on-pressure=${ONTOCODE_REASONING_SUGGEST_GC_ON_PRESSURE:true}
ontocode.reasoning.heap-comfort-used-ratio=${ONTOCODE_REASONING_HEAP_COMFORT_USED_RATIO:0.40}
ontocode.reasoning.heap-pressure-used-ratio=${ONTOCODE_REASONING_HEAP_PRESSURE_USED_RATIO:0.70}
ontocode.reasoning.max-retained-results=${ONTOCODE_REASONING_MAX_RETAINED_RESULTS:8}
ontocode.reasoner.max-triples=${ONTOCODE_REASONER_MAX_TRIPLES:1000000}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://admin:changeme123@mongo:27017/ontocode?authSource=admin}
spring.data.mongodb.auto-index-creation=false

logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
