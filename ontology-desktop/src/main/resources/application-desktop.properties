# ──────────────────────────────────────────────────────────────────────────────
# OntoCode Desktop — merged service profile
#
# Activated by:  --spring.profiles.active=desktop
# Electron (ServiceManager.js) passes all runtime endpoints via command-line
# args which take precedence over everything below.  This file provides safe
# fallback defaults for auth-specific properties not covered by the editor's
# application-desktop.properties.
# ──────────────────────────────────────────────────────────────────────────────

# ── Server ────────────────────────────────────────────────────────────────────
server.port=18083

# ── MongoDB ───────────────────────────────────────────────────────────────────
spring.data.mongodb.uri=mongodb://127.0.0.1:27117/ontocode-desktop
spring.data.mongodb.auto-index-creation=true

# ── JWT — same secret used by bundled auth + editor + plugin ─────────────────
# Electron overrides this via --jwt.secret=... command-line arg.
jwt.secret=b250b2NvZGUtZGVza3RvcC1qd3Qtc2VjcmV0LWtleS12MQ==
jwt.expiration=86400000

# ── Auth self-reference (auth is bundled in this same JVM) ───────────────────
app.auth-service-url=http://127.0.0.1:18083
auth.service.url=http://127.0.0.1:18083
app.base-url=http://127.0.0.1:18083

# ── Plugin-service self-reference (also bundled in this same JVM — not a
# separate 8087 service the way it is in the containerized web deployment) ───
ontology.plugin-service.url=http://127.0.0.1:18083

# ── Admin user auto-created on first startup ─────────────────────────────────
app.admin.email=admin@ontocode.local
app.admin.password=ontocode-desktop

# ── Email — fully disabled on desktop ────────────────────────────────────────
app.email.enabled=false
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=noop@localhost
spring.mail.password=noop
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
# Exclude mail auto-configuration entirely so unresolved ${SMTP_PASSWORD} in
# auth's application.properties never triggers a bean-binding failure.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.mail.MailSenderValidatorAutoConfiguration,\
  org.springframework.boot.autoconfigure.ssl.SslAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.ssl.SslHealthContributorAutoConfiguration

# ── Jira — disabled on desktop ───────────────────────────────────────────────
jira.enabled=false
jira.cloud.url=http://localhost
jira.user.email=noop@localhost
jira.api.token=noop
jira.project.key=NOOP
jira.epic.key=NOOP-0
jira.issue.type=Task

# ── Stripe — disabled on desktop (no cloud billing) ──────────────────────────
stripe.api.secret-key=sk_desktop_disabled
stripe.api.publishable-key=pk_desktop_disabled
stripe.webhook.secret=whsec_desktop_disabled
stripe.price.pro-monthly=price_desktop_disabled
stripe.price.pro-yearly=price_desktop_disabled
stripe.price.enterprise-monthly=price_desktop_disabled
stripe.price.enterprise-yearly=price_desktop_disabled

# ── Billing / auth scheduled jobs — noop on desktop ──────────────────────────
billing.reminder.enabled=false
billing.expiry-check.enabled=false
billing.autorenewal.enabled=false

# ── Actuator / health ─────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.mail.enabled=false

# ── Allow same-named beans from merged modules ───────────────────────────────
# auth + editor + plugin each have identically-named beans (GlobalExceptionHandler,
# ProjectController, SecurityConfig, etc.). Overriding lets the last-registered
# bean win rather than aborting startup with ConflictingBeanDefinitionException.
spring.main.allow-bean-definition-overriding=true

# Rate limit — disabled for desktop (single user, no abuse risk)
security.rate-limit.enabled=false
security.rate-limit.requests-per-minute=100000
spring.main.allow-circular-references=true

# ── Desktop mode flag ─────────────────────────────────────────────────────────
ontocode.desktop.mode=true

# ── OWLAPI fast-open (Protégé-style in-memory model) ─────────────────────────
ontocode.fastopen.auto-warm=true

# ── Reasoner timeouts ─────────────────────────────────────────────────────────
# Desktop is single-user/single-request, so it can afford to wait much longer
# for the reasoner than a shared cloud deployment (defaults there stay short to
# protect concurrent requests and the ALB timeout). These budgets only affect
# how long we wait before falling back to a partial/asserted result — they
# don't change reasoner correctness.
ontocode.reasoner.per-individual-timeout-ms=30000
ontocode.reasoner.realization-budget-ms=120000
ontocode.reasoner.inferred-individuals-budget-ms=120000
ontocode.reasoner.hierarchy-timeout-seconds=60

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.self.research=INFO
logging.level.org.springframework.boot=INFO
spring.devtools.restart.enabled=false
