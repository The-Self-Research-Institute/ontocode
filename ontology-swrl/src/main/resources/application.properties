# logging.level.root=WARN
# logging.level.self.research.ontology.swrl=INFO
# swrl.max-inferred-axioms=500
# spring.cache.caffeine.spec=maximumSize=200,expireAfterWrite=60m
# spring.data.mongodb.uri=${MONGODB_URI}
# ontology.editor.service.url=${EDITOR_SERVICE_URL}

# ==================================================
# ENVIRONMENT VARIABLES (for production deployment)
# ==================================================
# You can override any property using environment variables:
# 
# SPRING_DATA_MONGODB_URI=mongodb://prod-server:27017/ontology_swrl
# ONTOLOGY_EDITOR_SERVICE_URL=http://editor-service:8086
# SWRL_EXECUTION_TIMEOUT_SECONDS=300
# LOGGING_LEVEL_ROOT=WARN

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=false
spring.web.cors.max-age=3600