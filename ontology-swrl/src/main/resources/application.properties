# Server Configuration
spring.application.name=ontology-swrl
server.port=8084

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=ontology_swrl

# Ontology Editor Service URL
ontology.editor.service.url=http://localhost:8086

# SWRL Engine Configuration
swrl.engine.cache.enabled=true
swrl.engine.cache.max-size=10
swrl.engine.timeout-seconds=300

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.root=INFO
logging.level.self.research.ontology.swrl=DEBUG
logging.level.org.swrlapi=DEBUG

# CORS (for VS Code extension)
cors.allowed-origins=vscode-webview://*, http://localhost:*