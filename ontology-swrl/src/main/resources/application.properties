# ==================================================
# ONTOLOGY SWRL SERVICE - PRODUCTION CONFIGURATION
# ==================================================
# This configuration merges your existing settings with 
# critical additions for the improved Java implementation
# ==================================================

# ==================================================
# SERVER CONFIGURATION
# ==================================================
spring.application.name=ontology-swrl
server.port=8084

# Error handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# Compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# Request size limits - Support large files up to 1GB
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
spring.servlet.multipart.enabled=true

# ==================================================
# MONGODB CONFIGURATION
# ==================================================
# Use URI format for Docker deployment
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ontocode}

# Connection pool settings
spring.data.mongodb.repositories.enabled=true

# Alternative URI format (commented out - uncomment if needed)
# spring.data.mongodb.uri=mongodb://localhost:27017/ontocode

# ==================================================
# ONTOLOGY EDITOR SERVICE INTEGRATION
# ==================================================
ontology.editor.service.url=${ONTOLOGY_EDITOR_URL:http://localhost:8083}

# HTTP Client timeouts
http.client.connect-timeout=10000
http.client.read-timeout=30000
http.client.max-connections=100

# ==================================================
# SWRL ENGINE CONFIGURATION
# ==================================================

# Cache settings (CRITICAL for thread safety)
swrl.engine.cache.enabled=true
swrl.engine.cache.max-size=20

# Execution timeout (your 300s is good for complex rules)
swrl.engine.timeout-seconds=300
swrl.execution-timeout-seconds=300

# ✅ NEW: Engine cache TTL (prevents memory leaks)
swrl.engine-cache-ttl-hours=24

# ✅ NEW: Cache cleanup interval (1 hour = 3600000ms)
swrl.cache-cleanup-interval-ms=3600000

# ✅ NEW: Maximum inferred axioms to return
swrl.max-inferred-axioms=1000

# ==================================================
# CACHING CONFIGURATION (CRITICAL for performance)
# ==================================================
spring.cache.type=caffeine
spring.cache.cache-names=ontologies,executionResults,ruleEngines
spring.cache.caffeine.spec=maximumSize=50,expireAfterWrite=30m

# Cache statistics
# spring.cache.caffeine.spec=maximumSize=50,expireAfterWrite=30m,recordStats

# ==================================================
# RETRY CONFIGURATION (CRITICAL for reliability)
# ==================================================
spring.retry.enabled=true

# ==================================================
# ASYNC CONFIGURATION (for long-running tasks)
# ==================================================
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=6
spring.task.execution.pool.queue-capacity=50
spring.task.execution.thread-name-prefix=swrl-async-

# ==================================================
# SCHEDULING CONFIGURATION (for cache cleanup)
# ==================================================
spring.task.scheduling.pool.size=5

# ==================================================
# CORS CONFIGURATION
# ==================================================
# Your existing CORS for VS Code extension
cors.allowed-origins=vscode-webview://*, http://localhost:*
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.max-age=3600

# ==================================================
# ACTUATOR / MONITORING
# ==================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,caches
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Health check details
management.health.defaults.enabled=true
management.health.diskspace.enabled=true

# ==================================================\n# LOGGING — configured via logback-spring.xml for multi-file logging\n# Override ROOT level via LOGGING_LEVEL_ROOT env variable\n# ==================================================\nlogging.level.root=${LOGGING_LEVEL_ROOT:INFO}

# ==================================================
# VALIDATION CONFIGURATION
# ==================================================
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false

# ==================================================
# PROFILE-SPECIFIC SETTINGS
# ==================================================
# Activate profiles with: spring.profiles.active=dev or prod

# --- Development Profile ---
# Uncomment when running locally
# spring.profiles.active=dev

# --- Production Profile ---
# Uncomment when deploying to production
# spring.profiles.active=prod

# ==================================================
# ADDITIONAL CONFIGURATION NOTES
# ==================================================

# CRITICAL FIXES ENABLED:
# ✅ Thread-safe caching (Caffeine with TTL)
# ✅ Memory leak prevention (cache cleanup scheduler)
# ✅ Execution timeouts (prevents hanging)
# ✅ Retry logic (network resilience)
# ✅ Async execution (long-running tasks)
# ✅ Proper error responses

# PERFORMANCE OPTIMIZATIONS:
# ✅ Connection pooling
# ✅ Response compression
# ✅ Caffeine caching
# ✅ Configurable limits

# MONITORING & OBSERVABILITY:
# ✅ Actuator endpoints
# ✅ Prometheus metrics
# ✅ Detailed health checks
# ✅ Comprehensive logging

# ==================================================
# OPTIONAL: PROFILE-SPECIFIC OVERRIDES
# ==================================================

# Create these files if you need different settings per environment:
# - application-dev.properties (for development)
# - application-prod.properties (for production)
# - application-test.properties (for testing)

# Example application-dev.properties:
# ----------------------------------
# logging.level.self.research.ontology.swrl=TRACE
# swrl.execution-timeout-seconds=600
# spring.cache.caffeine.spec=maximumSize=10,expireAfterWrite=5m

# Example application-prod.properties:
