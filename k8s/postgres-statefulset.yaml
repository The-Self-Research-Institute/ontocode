apiVersion: v1
kind: Namespace
metadata:
  name: ontocode
  labels:
    name: ontocode
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ontocode
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:17
        args:
        - postgres
        - -c
        - shared_buffers=512MB
        - -c
        - max_connections=100
        - -c
        - effective_cache_size=1536MB
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: ontocode
        - name: POSTGRES_USER
          value: ontocode
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        startupProbe:
          exec:
            command: ["pg_isready", "-U", "ontocode", "-d", "ontocode"]
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "ontocode", "-d", "ontocode"]
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "ontocode", "-d", "ontocode"]
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: standard
      resources:
        requests:
          storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ontocode
spec:
  clusterIP: None
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres
