apiVersion: apps/v1
kind: Deployment
metadata:
  name: ontology-editor
  namespace: ontocode
  labels:
    app: ontology-editor
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ontology-editor
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ontology-editor
    spec:
      containers:
      - name: ontology-editor
        image: ontocode/ontology-editor:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8086
          name: http
        env:
        - name: ONTOCODE_DB_URL
          value: "jdbc:postgresql://postgres:5432/ontocode?socketTimeout=10&connectTimeout=3"
        - name: ONTOCODE_DB_USER
          value: ontocode
        - name: ONTOCODE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: password
        - name: ONTOCODE_BLOBS_DIR
          value: /data/blobs
        - name: ONTOCODE_DB_POOL_MAX
          value: "30"
        - name: CORS_ORIGINS
          value: "http://localhost,https://ontocode.app"
        - name: SPRING_PROFILES_ACTIVE
          value: production
        - name: JAVA_OPTS
          value: "-Xms512m -Xmx2g -XX:+UseG1GC"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8086
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8086
          initialDelaySeconds: 30
          periodSeconds: 5
        volumeMounts:
        - name: ontocode-blobs
          mountPath: /data/blobs
      securityContext:
        fsGroup: 1000
      volumes:
      - name: ontocode-blobs
        persistentVolumeClaim:
          claimName: ontocode-blobs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ontology-editor-service
  namespace: ontocode
spec:
  type: ClusterIP
  ports:
  - port: 8086
    targetPort: 8086
    protocol: TCP
  selector:
    app: ontology-editor
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ontology-editor-hpa
  namespace: ontocode
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ontology-editor
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
