# Docker-specific configuration for Gateway
# Uses Docker service names instead of localhost

# Application
spring.application.name=gateway
server.port=80

# Logging
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=DEBUG

# CORS Configuration
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600

# Route 0: Auth Service (Docker DNS)
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://auth:8086
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Route 1: Workspace Service (part of auth service, Docker DNS)
spring.cloud.gateway.routes[1].id=workspace-service
spring.cloud.gateway.routes[1].uri=http://auth:8086
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/workspaces/**

# Route 2: Project Service (part of auth service, Docker DNS)
spring.cloud.gateway.routes[2].id=project-service
spring.cloud.gateway.routes[2].uri=http://auth:8086
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/projects/**

# Route 3: Invitation Service (part of auth service, Docker DNS)
spring.cloud.gateway.routes[3].id=invitation-service
spring.cloud.gateway.routes[3].uri=http://auth:8086
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/invitations/**

# Route 4: OWL Editor Service - Ontology APIs (Docker DNS)
spring.cloud.gateway.routes[4].id=editor-service
spring.cloud.gateway.routes[4].uri=http://owl-editor:8083
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/ontology/**

# Route 5: OWL Editor Service - Shares API (Docker DNS)
spring.cloud.gateway.routes[5].id=editor-shares
spring.cloud.gateway.routes[5].uri=http://owl-editor:8083
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/shares/**

# Route 6: SWRL Service (Docker DNS)
spring.cloud.gateway.routes[6].id=swrl-service
spring.cloud.gateway.routes[6].uri=http://swrl-service:8084
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/swrl/**

# Route 7: Plugin Service (Docker DNS)
spring.cloud.gateway.routes[7].id=plugin-service
spring.cloud.gateway.routes[7].uri=http://plugin-service:8087
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/plugins/**

# Route 8: Plugin Service - Reasoner API (direct path, Docker DNS)
spring.cloud.gateway.routes[8].id=reasoner-service
spring.cloud.gateway.routes[8].uri=http://plugin-service:8087
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/reasoner/**

# Route 9: Plugin Service - Reasoner API (with plugin-service prefix, Docker DNS)
spring.cloud.gateway.routes[9].id=plugin-service-reasoner
spring.cloud.gateway.routes[9].uri=http://plugin-service:8087
spring.cloud.gateway.routes[9].predicates[0]=Path=/plugin-service/api/reasoner/**
spring.cloud.gateway.routes[9].filters[0]=RewritePath=/plugin-service/api/reasoner/(?<segment>.*), /api/reasoner/$\{segment}

# Route 10: Graph Visualization API (Docker DNS)
spring.cloud.gateway.routes[10].id=graph-service
spring.cloud.gateway.routes[10].uri=http://owl-editor:8083
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/graph/**

# Route 11: Collaborative Graph API (Docker DNS)
spring.cloud.gateway.routes[11].id=collab-graph-service
spring.cloud.gateway.routes[11].uri=http://owl-editor:8083
spring.cloud.gateway.routes[11].predicates[0]=Path=/api/collab-graph/**

# Route 12: SPARQL Query API (Docker DNS)
spring.cloud.gateway.routes[12].id=sparql-service
spring.cloud.gateway.routes[12].uri=http://owl-editor:8083
spring.cloud.gateway.routes[12].predicates[0]=Path=/api/sparql/**

# Route 13: WebSocket endpoint (SockJS websocket transport)
spring.cloud.gateway.routes[13].id=collab-ws
spring.cloud.gateway.routes[13].uri=ws://owl-editor:8083
spring.cloud.gateway.routes[13].predicates[0]=Path=/ws/websocket

# Route 14: WebSocket SockJS HTTP fallbacks
spring.cloud.gateway.routes[14].id=collab-ws-http
spring.cloud.gateway.routes[14].uri=http://owl-editor:8083
spring.cloud.gateway.routes[14].predicates[0]=Path=/ws/**

# Route 15: Issue Report Service - JIRA Integration  
spring.cloud.gateway.routes[15].id=issue-report-service
spring.cloud.gateway.routes[15].uri=http://owl-editor:8083
spring.cloud.gateway.routes[15].predicates[0]=Path=/api/v1/issues/**

# File Upload Configuration - Support large files up to 1GB
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
spring.codec.max-in-memory-size=50MB
spring.cloud.gateway.httpclient.max-header-size=512KB

# Actuator
management.endpoints.web.exposure.include=health,gateway,routes
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true
