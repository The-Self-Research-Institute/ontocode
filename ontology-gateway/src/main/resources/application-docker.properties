# Docker-specific configuration for Gateway — mirrors application.properties routes with Docker DNS names.

spring.application.name=gateway
server.port=80

logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=DEBUG

spring.cloud.gateway.default-filters[0]=PreserveHostHeader
spring.cloud.gateway.default-filters[1]=RemoveResponseHeader=X-Frame-Options

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
ontocode.gateway.require-jwt=${ONTOCODE_GATEWAY_REQUIRE_JWT:true}

# Route 0: Auth Service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://auth:8086
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Route 1: Workspace Service
spring.cloud.gateway.routes[1].id=workspace-service
spring.cloud.gateway.routes[1].uri=http://auth:8086
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/workspaces/**

# Route 2: Billing Service
spring.cloud.gateway.routes[2].id=billing-service
spring.cloud.gateway.routes[2].uri=http://auth:8086
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/billing/**

# Route 3: Admin endpoints
spring.cloud.gateway.routes[3].id=admin-service
spring.cloud.gateway.routes[3].uri=http://auth:8086
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/admin/**

# Route 4: Merge Service — before generic projects
spring.cloud.gateway.routes[4].id=merge-service
spring.cloud.gateway.routes[4].uri=http://owl-editor:8083
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/projects/*/merge/**

# Route 5: Project Service
spring.cloud.gateway.routes[5].id=project-service
spring.cloud.gateway.routes[5].uri=http://auth:8086
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/projects/**

# Route 6: Invitation Service
spring.cloud.gateway.routes[6].id=invitation-service
spring.cloud.gateway.routes[6].uri=http://auth:8086
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/invitations/**

# Route 7: Web Invitation Redirect
spring.cloud.gateway.routes[7].id=web-invitation-redirect
spring.cloud.gateway.routes[7].uri=http://auth:8086
spring.cloud.gateway.routes[7].predicates[0]=Path=/invite

# Route 8: Desktop installer downloads
spring.cloud.gateway.routes[8].id=desktop-downloads
spring.cloud.gateway.routes[8].uri=http://auth:8086
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/downloads/**

# Route 9: OWL Editor — Ontology APIs
spring.cloud.gateway.routes[9].id=editor-service
spring.cloud.gateway.routes[9].uri=http://owl-editor:8083
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/ontology/**

# Route 24: Import Queue API
spring.cloud.gateway.routes[24].id=import-queue-service
spring.cloud.gateway.routes[24].uri=http://owl-editor:8083
spring.cloud.gateway.routes[24].predicates[0]=Path=/api/import-queue/**

# Route 25: DL Query job status API
spring.cloud.gateway.routes[25].id=dl-query-jobs
spring.cloud.gateway.routes[25].uri=http://owl-editor:8083
spring.cloud.gateway.routes[25].predicates[0]=Path=/api/dl-query/**

# Route 10: Shares API
spring.cloud.gateway.routes[10].id=editor-shares
spring.cloud.gateway.routes[10].uri=http://owl-editor:8083
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/shares/**

# Route 11: SWRL Service
spring.cloud.gateway.routes[11].id=swrl-service
spring.cloud.gateway.routes[11].uri=http://swrl-service:8084
spring.cloud.gateway.routes[11].predicates[0]=Path=/api/swrl/**

# Route 12: Plugin Service
spring.cloud.gateway.routes[12].id=plugin-service
spring.cloud.gateway.routes[12].uri=http://plugin-service:8087
spring.cloud.gateway.routes[12].predicates[0]=Path=/api/plugins/**

# Route 13: Reasoner API (direct)
spring.cloud.gateway.routes[13].id=reasoner-service
spring.cloud.gateway.routes[13].uri=http://plugin-service:8087
spring.cloud.gateway.routes[13].predicates[0]=Path=/api/reasoner/**

# Route 14: Reasoner API (prefixed)
spring.cloud.gateway.routes[14].id=plugin-service-reasoner
spring.cloud.gateway.routes[14].uri=http://plugin-service:8087
spring.cloud.gateway.routes[14].predicates[0]=Path=/plugin-service/api/reasoner/**
spring.cloud.gateway.routes[14].filters[0]=RewritePath=/plugin-service/api/reasoner/(?<segment>.*), /api/reasoner/$\{segment}

# Route 15: Graph Visualization
spring.cloud.gateway.routes[15].id=graph-service
spring.cloud.gateway.routes[15].uri=http://owl-editor:8083
spring.cloud.gateway.routes[15].predicates[0]=Path=/api/graph/**

# Route 16: Collaborative Graph
spring.cloud.gateway.routes[16].id=collab-graph-service
spring.cloud.gateway.routes[16].uri=http://owl-editor:8083
spring.cloud.gateway.routes[16].predicates[0]=Path=/api/collab-graph/**

# Route 17: SPARQL API
spring.cloud.gateway.routes[17].id=sparql-service
spring.cloud.gateway.routes[17].uri=http://owl-editor:8083
spring.cloud.gateway.routes[17].predicates[0]=Path=/api/sparql/**

# Route 18: Citation Service
spring.cloud.gateway.routes[18].id=citation-service
spring.cloud.gateway.routes[18].uri=http://owl-editor:8083
spring.cloud.gateway.routes[18].predicates[0]=Path=/api/citations/**

# Route 19: Issue Report (JIRA)
spring.cloud.gateway.routes[19].id=issue-report-service
spring.cloud.gateway.routes[19].uri=http://owl-editor:8083
spring.cloud.gateway.routes[19].predicates[0]=Path=/api/v1/issues/**

# Route 20: WebSocket (native)
spring.cloud.gateway.routes[20].id=collab-ws
spring.cloud.gateway.routes[20].uri=ws://owl-editor:8083
spring.cloud.gateway.routes[20].predicates[0]=Path=/ws/websocket,/ws/*/*/websocket

# Route 21: WebSocket SockJS HTTP fallbacks
spring.cloud.gateway.routes[21].id=collab-ws-http
spring.cloud.gateway.routes[21].uri=http://owl-editor:8083
spring.cloud.gateway.routes[21].predicates[0]=Path=/ws/**

# Route 22: Editor static assets
spring.cloud.gateway.routes[22].id=editor-assets
spring.cloud.gateway.routes[22].uri=http://owl-editor:8083
spring.cloud.gateway.routes[22].predicates[0]=Path=/assets/**

# Route 26: User Project Preferences API (syncMode persistence)
spring.cloud.gateway.routes[26].id=preferences-service
spring.cloud.gateway.routes[26].uri=http://owl-editor:8083
spring.cloud.gateway.routes[26].predicates[0]=Path=/api/preferences/**

# Route 27: Maintenance status (public — no JWT required)
# Must override the base profile's localhost URI: without this the docker
# gateway inherits http://localhost:8086 and every maintenance poll 502s.
spring.cloud.gateway.routes[27].id=maintenance-service
spring.cloud.gateway.routes[27].uri=http://auth:8086
spring.cloud.gateway.routes[27].predicates[0]=Path=/api/maintenance/**

# Route 23: Editor webview catch-all (last)
spring.cloud.gateway.routes[23].id=editor-webview
spring.cloud.gateway.routes[23].uri=http://owl-editor:8083
spring.cloud.gateway.routes[23].predicates[0]=Path=/projects/**
spring.cloud.gateway.routes[23].order=1000

spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
spring.codec.max-in-memory-size=64MB
spring.cloud.gateway.httpclient.max-header-size=512KB
spring.cloud.gateway.httpclient.response-timeout=${GATEWAY_HTTP_RESPONSE_TIMEOUT:7200s}
spring.cloud.gateway.httpclient.websocket.max-frame-payload-length=65536

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized
management.endpoint.gateway.enabled=false
