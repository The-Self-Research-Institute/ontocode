# Docker-specific configuration for Gateway
# Uses Docker service names instead of localhost

# Application
spring.application.name=gateway
server.port=80

# Logging
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=DEBUG

# CORS is handled by GatewayCorsConfig.java (single source of truth)
# Do NOT add spring.cloud.gateway.globalcors here to avoid duplicate headers

# Default filters (must be re-declared here; profile-specific props override the base list)
spring.cloud.gateway.default-filters[0]=PreserveHostHeader

# Route 0: Auth Service (Docker DNS)
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://auth:8086
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Route 1: Workspace Service (part of auth service, Docker DNS)
spring.cloud.gateway.routes[1].id=workspace-service
spring.cloud.gateway.routes[1].uri=http://auth:8086
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/workspaces/**

# Route 19: Billing Service (part of auth service, Docker DNS)
spring.cloud.gateway.routes[19].id=billing-service
spring.cloud.gateway.routes[19].uri=http://auth:8086
spring.cloud.gateway.routes[19].predicates[0]=Path=/api/billing/**

# Route 2: Merge Service (part of ontology-editor service, Docker DNS) - MUST come before generic projects route
spring.cloud.gateway.routes[2].id=merge-service
spring.cloud.gateway.routes[2].uri=http://owl-editor:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/projects/*/merge/**

# Route 3: Project Service (part of auth service, Docker DNS)
spring.cloud.gateway.routes[3].id=project-service
spring.cloud.gateway.routes[3].uri=http://auth:8086
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/projects/**

# Route 4: Invitation Service (part of auth service, Docker DNS)
spring.cloud.gateway.routes[4].id=invitation-service
spring.cloud.gateway.routes[4].uri=http://auth:8086
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/invitations/**

# Route 5: OWL Editor Service - Ontology APIs (Docker DNS)
spring.cloud.gateway.routes[5].id=editor-service
spring.cloud.gateway.routes[5].uri=http://owl-editor:8083
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/ontology/**

# Route 6: OWL Editor Service - Shares API (Docker DNS)
spring.cloud.gateway.routes[6].id=editor-shares
spring.cloud.gateway.routes[6].uri=http://owl-editor:8083
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/shares/**

# Route 7: SWRL Service (Docker DNS)
spring.cloud.gateway.routes[7].id=swrl-service
spring.cloud.gateway.routes[7].uri=http://swrl-service:8084
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/swrl/**

# Route 8: Plugin Service (Docker DNS)
spring.cloud.gateway.routes[8].id=plugin-service
spring.cloud.gateway.routes[8].uri=http://plugin-service:8087
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/plugins/**

# Route 9: Plugin Service - Reasoner API (direct path, Docker DNS)
spring.cloud.gateway.routes[9].id=reasoner-service
spring.cloud.gateway.routes[9].uri=http://plugin-service:8087
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/reasoner/**

# Route 10: Plugin Service - Reasoner API (with plugin-service prefix, Docker DNS)
spring.cloud.gateway.routes[10].id=plugin-service-reasoner
spring.cloud.gateway.routes[10].uri=http://plugin-service:8087
spring.cloud.gateway.routes[10].predicates[0]=Path=/plugin-service/api/reasoner/**
spring.cloud.gateway.routes[10].filters[0]=RewritePath=/plugin-service/api/reasoner/(?<segment>.*), /api/reasoner/$\{segment}

# Route 11: Graph Visualization API (Docker DNS)
spring.cloud.gateway.routes[11].id=graph-service
spring.cloud.gateway.routes[11].uri=http://owl-editor:8083
spring.cloud.gateway.routes[11].predicates[0]=Path=/api/graph/**

# Route 12: Collaborative Graph API (Docker DNS)
spring.cloud.gateway.routes[12].id=collab-graph-service
spring.cloud.gateway.routes[12].uri=http://owl-editor:8083
spring.cloud.gateway.routes[12].predicates[0]=Path=/api/collab-graph/**

# Route 13: SPARQL Query API (Docker DNS)
spring.cloud.gateway.routes[13].id=sparql-service
spring.cloud.gateway.routes[13].uri=http://owl-editor:8083
spring.cloud.gateway.routes[13].predicates[0]=Path=/api/sparql/**

# Route 14: WebSocket endpoint (native WebSocket and SockJS websocket transport)
spring.cloud.gateway.routes[14].id=collab-ws
spring.cloud.gateway.routes[14].uri=ws://owl-editor:8083
spring.cloud.gateway.routes[14].predicates[0]=Path=/ws/websocket,/ws/*/*/websocket

# Route 15: WebSocket SockJS HTTP fallbacks (info, xhr, eventsource, etc.)
spring.cloud.gateway.routes[15].id=collab-ws-http
spring.cloud.gateway.routes[15].uri=http://owl-editor:8083
spring.cloud.gateway.routes[15].predicates[0]=Path=/ws/**

# Route 16: Editor Static Assets (webview CSS/JS files)
spring.cloud.gateway.routes[16].id=editor-assets
spring.cloud.gateway.routes[16].uri=http://owl-editor:8083
spring.cloud.gateway.routes[16].predicates[0]=Path=/assets/**

# Route 17: Editor Webview Root (catch-all for editor HTML)
spring.cloud.gateway.routes[17].id=editor-webview
spring.cloud.gateway.routes[17].uri=http://owl-editor:8083
spring.cloud.gateway.routes[17].predicates[0]=Path=/projects/**
spring.cloud.gateway.routes[17].order=1000

# Route 18: Issue Report Service - JIRA Integration  
spring.cloud.gateway.routes[16].id=issue-report-service
spring.cloud.gateway.routes[16].uri=http://owl-editor:8083
spring.cloud.gateway.routes[16].predicates[0]=Path=/api/v1/issues/**

# Route 17: Citation Service (Docker DNS)
spring.cloud.gateway.routes[17].id=citation-service
spring.cloud.gateway.routes[17].uri=http://owl-editor:8083
spring.cloud.gateway.routes[17].predicates[0]=Path=/api/citations/**

# Route 18: Web Invitation Redirect (Docker DNS)
spring.cloud.gateway.routes[18].id=web-invitation-redirect
spring.cloud.gateway.routes[18].uri=http://auth:8086
spring.cloud.gateway.routes[18].predicates[0]=Path=/invite

# File Upload Configuration - Support large files up to 1GB
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
spring.codec.max-in-memory-size=512MB
spring.cloud.gateway.httpclient.max-header-size=512KB
spring.cloud.gateway.httpclient.response-timeout=1800s

# WebSocket Configuration
spring.cloud.gateway.httpclient.websocket.max-frame-payload-length=65536

# Actuator
management.endpoints.web.exposure.include=health,gateway,routes
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true
