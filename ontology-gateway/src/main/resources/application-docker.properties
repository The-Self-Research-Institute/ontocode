# Docker-specific configuration for Gateway
# Uses Docker service names instead of localhost

# Application
spring.application.name=gateway
server.port=8080

# Logging
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=DEBUG

# CORS Configuration
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600

# Route 1: Auth Service (Docker DNS)
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://auth:8086
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Route 2: OWL Editor Service - Ontology APIs (Docker DNS)
spring.cloud.gateway.routes[1].id=editor-service
spring.cloud.gateway.routes[1].uri=http://owl-editor:8083
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/ontology/**

# Route 3: OWL Editor Service - Projects API (Docker DNS)
spring.cloud.gateway.routes[2].id=editor-projects
spring.cloud.gateway.routes[2].uri=http://owl-editor:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/projects/**

# Route 4: OWL Editor Service - Shares API (Docker DNS)
spring.cloud.gateway.routes[3].id=editor-shares
spring.cloud.gateway.routes[3].uri=http://owl-editor:8083
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/shares/**

# Route 5: SWRL Service (Docker DNS)
spring.cloud.gateway.routes[4].id=swrl-service
spring.cloud.gateway.routes[4].uri=http://swrl-service:8084
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/swrl/**

# Route 6: Plugin Service (Docker DNS)
spring.cloud.gateway.routes[5].id=plugin-service
spring.cloud.gateway.routes[5].uri=http://plugin-service:8087
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/plugins/**

# Route 7: Graph Visualization API (Docker DNS)
spring.cloud.gateway.routes[6].id=graph-service
spring.cloud.gateway.routes[6].uri=http://owl-editor:8083
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/graph/**

# Route 8: Collaborative Graph API (Docker DNS)
spring.cloud.gateway.routes[7].id=collab-graph-service
spring.cloud.gateway.routes[7].uri=http://owl-editor:8083
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/collab-graph/**

# Route 9: SPARQL Query API (Docker DNS)
spring.cloud.gateway.routes[8].id=sparql-service
spring.cloud.gateway.routes[8].uri=http://owl-editor:8083
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/sparql/**

# File Upload Configuration - Support large files up to 1GB
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
spring.codec.max-in-memory-size=50MB
spring.cloud.gateway.httpclient.max-header-size=512KB

# Actuator
management.endpoints.web.exposure.include=health,gateway,routes
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true
