spring.application.name=gateway
server.port=8082

# ? DISABLE Spring Security Auto-Configuration
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration

# File upload configuration - IMPORTANT for large OWL files
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=300MB
spring.codec.max-in-memory-size=314572800

# ? Gateway-specific codec size
spring.webflux.codec.max-in-memory-size=314572800

# JWT Secret (for future use)
jwt.secret=deeea417e35bc10f211c02c5e68aacd3c2ab230fd81a978958bb211b2b2dd554

# ============== ROUTES ==============

# Route 0: Auth Service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://localhost:8086
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Route 1: OWL Editor Service
spring.cloud.gateway.routes[1].id=owleditor-service
spring.cloud.gateway.routes[1].uri=http://localhost:8083
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/ontology/**

# Route 2: 
spring.cloud.gateway.routes[1].id=swrl-services
spring.cloud.gateway.routes[1].uri=http://localhost:8084
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/ontology-swrl/**

# Global CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations[/**].allowed-origin-patterns=*
spring.cloud.gateway.globalcors.cors-configurations[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD
spring.cloud.gateway.globalcors.cors-configurations[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations[/**].max-age=3600

# Logging
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web.cors=DEBUG
logging.level.reactor.netty.http.server=DEBUG

# Show route mappings
logging.level.org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping=DEBUG