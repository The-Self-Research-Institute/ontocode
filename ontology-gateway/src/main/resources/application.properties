# Application
spring.application.name=gateway
server.port=80

# Gateway Configuration - Allow encoded slashes for hierarchical project IDs
spring.cloud.gateway.httpserver.wiretap=false
spring.cloud.gateway.httpclient.wiretap=false
# Preserve encoded characters in URLs (critical for hierarchical project IDs)
spring.cloud.gateway.httpclient.ssl.use-insecure-trust-manager=false
spring.cloud.gateway.default-filters[0]=PreserveHostHeader
spring.cloud.gateway.default-filters[1]=RemoveResponseHeader=X-Frame-Options

# Logging
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=DEBUG

# CORS is handled by GatewayCorsConfig.java (single source of truth)
# Do NOT add spring.cloud.gateway.globalcors here to avoid duplicate headers

# Route 1: Auth Service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://localhost:8086
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Route 1a: Workspace Service (part of auth service)
spring.cloud.gateway.routes[1].id=workspace-service
spring.cloud.gateway.routes[1].uri=http://localhost:8086
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/workspaces/**

# Route 19: Billing Service (part of auth service)
spring.cloud.gateway.routes[19].id=billing-service
spring.cloud.gateway.routes[19].uri=http://localhost:8086
spring.cloud.gateway.routes[19].predicates[0]=Path=/api/billing/**

# Route 20: Admin endpoints (currently: email-test endpoints under
# ontology-auth, gated by ROLE_ADMIN and email.test-endpoints.enabled).
spring.cloud.gateway.routes[20].id=admin-service
spring.cloud.gateway.routes[20].uri=http://localhost:8086
spring.cloud.gateway.routes[20].predicates[0]=Path=/api/admin/**

# Route 1b: Merge Service (part of ontology-editor service) - MUST come before generic projects route
spring.cloud.gateway.routes[2].id=merge-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/projects/*/merge/**

# Route 1c: Project Service (part of auth service)
spring.cloud.gateway.routes[3].id=project-service
spring.cloud.gateway.routes[3].uri=http://localhost:8086
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/projects/**

# Route 1c: Project Service (part of auth service)
spring.cloud.gateway.routes[3].id=project-service
spring.cloud.gateway.routes[3].uri=http://localhost:8086
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/projects/**

# Route 1d: Invitation Service (part of auth service)
spring.cloud.gateway.routes[4].id=invitation-service
spring.cloud.gateway.routes[4].uri=http://localhost:8086
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/invitations/**

# Route 1e: Web Invitation Redirect (public route for email links)
spring.cloud.gateway.routes[5].id=web-invitation-redirect
spring.cloud.gateway.routes[5].uri=http://localhost:8086
spring.cloud.gateway.routes[5].predicates[0]=Path=/invite

# Route 2: OWL Editor Service - Ontology APIs
spring.cloud.gateway.routes[6].id=editor-service
spring.cloud.gateway.routes[6].uri=http://localhost:8083
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/ontology/**

# Route 3: OWL Editor Service - Shares API (deprecated - using auth service now)
spring.cloud.gateway.routes[7].id=editor-shares
spring.cloud.gateway.routes[7].uri=http://localhost:8083
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/shares/**

# Route 5: SWRL Service
spring.cloud.gateway.routes[8].id=swrl-service
spring.cloud.gateway.routes[8].uri=http://localhost:8084
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/swrl/**

# Route 6: Plugin Service - Plugin Management
spring.cloud.gateway.routes[9].id=plugin-service
spring.cloud.gateway.routes[9].uri=http://localhost:8087
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/plugins/**

# Route 6a: Plugin Service - Reasoner API (direct path)
spring.cloud.gateway.routes[10].id=reasoner-service
spring.cloud.gateway.routes[10].uri=http://localhost:8087
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/reasoner/**

# Route 6b: Plugin Service - Reasoner API (with plugin-service prefix)
spring.cloud.gateway.routes[11].id=plugin-service-reasoner
spring.cloud.gateway.routes[11].uri=http://localhost:8087
spring.cloud.gateway.routes[11].predicates[0]=Path=/plugin-service/api/reasoner/**
spring.cloud.gateway.routes[11].filters[0]=RewritePath=/plugin-service/api/reasoner/(?<segment>.*), /api/reasoner/$\{segment}

# Route 8: Graph Visualization API (Optimized GraphDB with caching)
# Redirects old Neo4j endpoint to optimized GraphDB endpoint for backward compatibility
spring.cloud.gateway.routes[12].id=graph-service
spring.cloud.gateway.routes[12].uri=http://localhost:8083
spring.cloud.gateway.routes[12].predicates[0]=Path=/api/graph/**

# Route 9: Collaborative Graph API (Future real-time features)
spring.cloud.gateway.routes[13].id=collab-graph-service
spring.cloud.gateway.routes[13].uri=http://localhost:8083
spring.cloud.gateway.routes[13].predicates[0]=Path=/api/collab-graph/**

# Route 10: SPARQL Query/Update API (for Fuzzy Plugin and advanced queries)
spring.cloud.gateway.routes[14].id=sparql-service
spring.cloud.gateway.routes[14].uri=http://localhost:8083
spring.cloud.gateway.routes[14].predicates[0]=Path=/api/sparql/**

# Route 11: Editor Static Assets (webview CSS/JS files)
spring.cloud.gateway.routes[15].id=editor-assets
spring.cloud.gateway.routes[15].uri=http://localhost:8083
spring.cloud.gateway.routes[15].predicates[0]=Path=/assets/**

# Route 12: Editor Webview Root (catch-all for editor HTML, MUST be last)
spring.cloud.gateway.routes[16].id=editor-webview
spring.cloud.gateway.routes[16].uri=http://localhost:8083
spring.cloud.gateway.routes[16].predicates[0]=Path=/projects/**
spring.cloud.gateway.routes[16].order=1000

# Route 11: WebSocket endpoint (native WebSocket and SockJS websocket transport)
spring.cloud.gateway.routes[14].id=collab-ws
spring.cloud.gateway.routes[14].uri=ws://localhost:8083
spring.cloud.gateway.routes[14].predicates[0]=Path=/ws/websocket,/ws/*/*/websocket

# Route 12: WebSocket SockJS HTTP fallbacks (info, xhr, eventsource, etc.)
spring.cloud.gateway.routes[15].id=collab-ws-http
spring.cloud.gateway.routes[15].uri=http://localhost:8083
spring.cloud.gateway.routes[15].predicates[0]=Path=/ws/**

# Route 13: Citation Service - Citation Management API
spring.cloud.gateway.routes[16].id=citation-service
spring.cloud.gateway.routes[16].uri=http://localhost:8083
spring.cloud.gateway.routes[16].predicates[0]=Path=/api/citations/**

# Route 14: Issue Report Service - JIRA Integration
spring.cloud.gateway.routes[17].id=issue-report-service
spring.cloud.gateway.routes[17].uri=http://localhost:8083
spring.cloud.gateway.routes[17].predicates[0]=Path=/api/v1/issues/**

# File Upload Configuration - Support large files up to 1GB
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
# 64MB codec buffer: gateway streams large file uploads through Netty channels without
# reading the body — codec buffer only activates for JSON/small payloads that filters
# need to inspect. 512MB caused 3-concurrent-upload OOM on t3.large (1536m heap).
spring.codec.max-in-memory-size=64MB
spring.cloud.gateway.httpclient.max-header-size=512KB
spring.cloud.gateway.httpclient.response-timeout=1800s

# WebSocket Configuration
spring.cloud.gateway.httpclient.websocket.max-frame-payload-length=65536

# Actuator
management.endpoints.web.exposure.include=health,gateway,routes
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true


