# Application
spring.application.name=gateway
server.port=80

# Logging
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=DEBUG

# CORS Configuration - FIXED
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600

# Route 1: Auth Service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://localhost:8086
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Route 2: OWL Editor Service - Ontology APIs
spring.cloud.gateway.routes[1].id=editor-service
spring.cloud.gateway.routes[1].uri=http://localhost:8083
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/ontology/**

# Route 3: OWL Editor Service - Projects API
spring.cloud.gateway.routes[2].id=editor-projects
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/projects/**

# Route 4: OWL Editor Service - Shares API
spring.cloud.gateway.routes[3].id=editor-shares
spring.cloud.gateway.routes[3].uri=http://localhost:8083
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/shares/**

# Route 5: SWRL Service
spring.cloud.gateway.routes[4].id=swrl-service
spring.cloud.gateway.routes[4].uri=http://localhost:8084
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/swrl/**

# Route 6: Plugin Service - Plugin Management
spring.cloud.gateway.routes[5].id=plugin-service
spring.cloud.gateway.routes[5].uri=http://localhost:8087
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/plugins/**

# Route 6a: Plugin Service - Reasoner API (direct path)
spring.cloud.gateway.routes[6].id=reasoner-service
spring.cloud.gateway.routes[6].uri=http://localhost:8087
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/reasoner/**

# Route 6b: Plugin Service - Reasoner API (with plugin-service prefix)
spring.cloud.gateway.routes[7].id=plugin-service-reasoner
spring.cloud.gateway.routes[7].uri=http://localhost:8087
spring.cloud.gateway.routes[7].predicates[0]=Path=/plugin-service/api/reasoner/**
spring.cloud.gateway.routes[7].filters[0]=RewritePath=/plugin-service/api/reasoner/(?<segment>.*), /api/reasoner/$\{segment}

# Route 8: Graph Visualization API (Optimized GraphDB with caching)
# Redirects old Neo4j endpoint to optimized GraphDB endpoint for backward compatibility
spring.cloud.gateway.routes[8].id=graph-service
spring.cloud.gateway.routes[8].uri=http://localhost:8083
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/graph/**

# Route 9: Collaborative Graph API (Future real-time features)
spring.cloud.gateway.routes[9].id=collab-graph-service
spring.cloud.gateway.routes[9].uri=http://localhost:8083
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/collab-graph/**

# Route 10: SPARQL Query/Update API (for Fuzzy Plugin and advanced queries)
spring.cloud.gateway.routes[10].id=sparql-service
spring.cloud.gateway.routes[10].uri=http://localhost:8083
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/sparql/**

# Route 11: WebSocket endpoint (SockJS websocket transport)
spring.cloud.gateway.routes[11].id=collab-ws
spring.cloud.gateway.routes[11].uri=ws://localhost:8083
spring.cloud.gateway.routes[11].predicates[0]=Path=/ws/websocket

# Route 12: WebSocket SockJS HTTP fallbacks
spring.cloud.gateway.routes[12].id=collab-ws-http
spring.cloud.gateway.routes[12].uri=http://localhost:8083
spring.cloud.gateway.routes[12].predicates[0]=Path=/ws/**

# File Upload Configuration - Support large files up to 1GB
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
spring.codec.max-in-memory-size=50MB
spring.cloud.gateway.httpclient.max-header-size=512KB

# Actuator
management.endpoints.web.exposure.include=health,gateway,routes
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true


