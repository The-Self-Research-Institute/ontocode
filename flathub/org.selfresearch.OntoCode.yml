app-id: org.selfresearch.OntoCode
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
  - org.freedesktop.Sdk.Extension.openjdk17
  - org.freedesktop.Sdk.Extension.node20
command: ontocode-desktop
separate-locales: false

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=x11
  - --device=dri

modules:
  - name: ontocode-desktop
    buildsystem: simple
    build-options:
      # openjdk21's bin/ has mvn (bundled by the extension itself) + java/javac/jlink;
      # node20's bin/ has node/npm. JAVA_HOME defaults to 21 — the one ontology-swrl
      # build-command below overrides both JAVA_HOME and PATH for its JDK 17 requirement.
      append-path: /usr/lib/sdk/openjdk21/bin:/usr/lib/sdk/node20/bin
      env:
        JAVA21_HOME: /usr/lib/sdk/openjdk21/jvm/openjdk-21
        JAVA17_HOME: /usr/lib/sdk/openjdk17/jvm/openjdk-17
        JAVA_HOME: /usr/lib/sdk/openjdk21/jvm/openjdk-21
        # electron-app/scripts/prepare-resources.js reads JAVA21_HOME/JAVA17_HOME
        # itself to jlink the two custom JREs (see JLINK_MODULES in that file) —
        # nothing further to do here, no jlink invocation needed in this manifest.
        XDG_CACHE_HOME: /run/build/ontocode-desktop/flatpak-node/cache
        npm_config_cache: /run/build/ontocode-desktop/flatpak-node/npm-cache
        npm_config_nodedir: /usr/lib/sdk/node20
        npm_config_offline: 'true'
    build-commands:
      # ── 1. Java backend — Maven, fully offline against the pre-seeded
      #      m2-offline/ repo (see generated/maven-offline-notes.md for exactly
      #      how that repo's contents were derived and validated end-to-end;
      #      the `install -N` step and the auth/editor artifactId names — auth,
      #      owlEditor — are not typos, see that file). ──────────────────────
      - >-
        export JAVA_HOME="$JAVA21_HOME" &&
        export PATH="$JAVA_HOME/bin:$PATH" &&
        M2="$PWD/m2-offline" &&
        mvn install -N -DskipTests -q -o -Dmaven.repo.local="$M2" &&
        mvn install -pl shared/common-models,shared/common-utils -DskipTests -q -o -Dmaven.repo.local="$M2" &&
        mvn install -pl ontology-auth,ontology-editor -DskipTests -q -o -Dmaven.repo.local="$M2" &&
        (cd ontology-plugin-service && mvn install -DskipTests -q -o -Dmaven.repo.local="$M2") &&
        (cd ontology-desktop && mvn package -DskipTests -q -o -Dmaven.repo.local="$M2")
      - >-
        export JAVA_HOME="$JAVA17_HOME" &&
        export PATH="$JAVA_HOME/bin:$PATH" &&
        mvn package -pl ontology-swrl -DskipTests -q -o -Dmaven.repo.local="$PWD/m2-offline"
      - mkdir -p electron-app/resources/backend/jars
      - cp ontology-desktop/target/ontology-desktop-1.0.0.jar electron-app/resources/backend/jars/desktop.jar
      - cp ontology-swrl/target/ontology-swrl-1.0.0.jar electron-app/resources/backend/jars/swrl.jar

      # ── 2. Pre-seed Fuseki + MongoDB at the exact repo-relative paths
      #      prepare-resources.js's copyIfExists() checks first, so its own
      #      network-download fallback never triggers. ─────────────────────
      - mkdir -p fuseki-docker
      - cp fuseki-src/fuseki-server.jar fuseki-docker/fuseki-server.jar
      - >-
        mkdir -p data/mongodb/bin/linux-x64 data/mongodb/bin/linux-arm64 &&
        if [ -d mongo-src-x64 ]; then
          f=$(find mongo-src-x64 -name mongod -type f | head -1) &&
          cp "$f" data/mongodb/bin/linux-x64/mongod &&
          chmod +x data/mongodb/bin/linux-x64/mongod;
        fi &&
        if [ -d mongo-src-arm64 ]; then
          f=$(find mongo-src-arm64 -name mongod -type f | head -1) &&
          cp "$f" data/mongodb/bin/linux-arm64/mongod &&
          chmod +x data/mongodb/bin/linux-arm64/mongod;
        fi

      # ── 3. React UI (vite), offline via the node20 extension + generated
      #      npm sources. ──────────────────────────────────────────────────
      - npm --prefix ontology-vscode-extension/webview-src install --offline
      - npm --prefix ontology-vscode-extension/webview-src run build:electron

      # ── 4. Electron app deps, then prepare-resources.js (jlinks both JREs,
      #      wires up the jars/fuseki/mongo staged above — nothing left for
      #      it to download), then package with electron-builder --dir
      #      (skips AppImage/deb, which is what would need extra
      #      network-fetched helper binaries). ───────────────────────────
      - npm --prefix electron-app install --offline
      - npm --prefix electron-app run prepare-resources
      - (cd electron-app && ./node_modules/.bin/electron-builder --linux --dir -c.npmRebuild=false -c.electronDist=/run/build/ontocode-desktop/flatpak-node/cache/electron/electron-v43.4.0-linux-x64.zip)

      # ── 5. Install into /app ─────────────────────────────────────────────
      - mkdir -p /app/ontocode-desktop
      - cp -r electron-app/dist-electron/linux-unpacked/* /app/ontocode-desktop/
      - chmod +x /app/ontocode-desktop/ontocode-desktop
      - install -Dm755 ontocode-desktop-wrapper.sh /app/bin/ontocode-desktop
      - install -Dm644 packaging/linux/org.selfresearch.OntoCode.desktop /app/share/applications/org.selfresearch.OntoCode.desktop
      - install -Dm644 packaging/linux/org.selfresearch.OntoCode.metainfo.xml /app/share/metainfo/org.selfresearch.OntoCode.metainfo.xml
      - install -Dm644 packaging/linux/org.selfresearch.OntoCode.png /app/share/icons/hicolor/512x512/apps/org.selfresearch.OntoCode.png
    sources:
      # Whole monorepo. Pinned to origin/main's tip as of 2026-08-22 — the
      # local dev checkout used to generate the sources below was actually 2
      # commits ahead of this (unpushed), but those 2 commits don't touch any
      # pom.xml/package-lock.json, so the generated/*.json files are still
      # accurate against this commit. NOT the desktop-v1.1.0-beta.19 release
      # tag. Before an actual Flathub submission, re-pin this to a real
      # release tag and regenerate every generated/*.json against that tag's
      # lockfiles/poms (flatpak-node-generator for the two npm projects; see
      # generated/maven-offline-notes.md for the Maven side).
      - type: git
        url: https://github.com/The-Self-Research-Institute/ontocode.git
        commit: cc27db0a2a0f3c80c35052da9a6774e92c974363

      - type: archive
        url: https://archive.apache.org/dist/jena/binaries/apache-jena-fuseki-6.1.0.tar.gz
        sha512: 75457f45d14397876a41ed51abe7ae5d2f1e708dfe1315765f858158bc5c6813bc036ec1539ddc4dffd26201f5cc31fadec299ca5c3dc2548b723513ed31d326
        dest: fuseki-src

      - type: archive
        url: https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2204-6.0.29.tgz
        sha256: 46de5a28be8066e0c44b60e9919e5edd00c28f55fc187f8e0c60ab38dedc9054
        dest: mongo-src-x64
        only-arches:
          - x86_64

      - type: archive
        url: https://fastdl.mongodb.org/linux/mongodb-linux-aarch64-ubuntu2204-6.0.29.tgz
        sha256: 81003080fd01a95dc7bbc08a5e62c80d22b55df0ce5df6b674c2ec915a4b825b
        dest: mongo-src-arm64
        only-arches:
          - aarch64

      # flatpak-node-generator output — npm deps for both Node projects we
      # build (electron-app itself, and the webview-src React UI it bundles).
      - generated/generated-sources-electron-app.json
      - generated/generated-sources-webview-src.json

      # Hand-generated offline Maven repo (no polished generator tool exists
      # for Maven the way flatpak-node-generator exists for npm — see
      # generated/maven-offline-notes.md for how this was produced and
      # validated against a real, from-scratch, fully-offline build). Every
      # third-party jar/pom the reactor needs, laid out under m2-offline/ so
      # `mvn -o -Dmaven.repo.local=m2-offline` above never touches the network.
      - generated/generated-maven-sources.json
      - generated/generated-maven-metadata.json

      - type: script
        dest-filename: ontocode-desktop-wrapper.sh
        commands:
          - |
            #!/bin/sh
            exec zypak-wrapper /app/ontocode-desktop/ontocode-desktop "$@"
